# Visual fact audit, segment B8 (wafer and reticle stages, scanning, alignment, overlay, throughput, data). One row per
# engineering / structural / optical / numeric detail the PICTURE, on-screen text or narration shows. Checked 2026-10-21
# against storyboard.timed.yaml (B8_01-B8_20, identical to parts/p3_B7-D.yaml), blender/shots/b8_scenes.py,
# blender/scripts/build_machine.py (B8_10), mograph/b8.py (+ b6._fields) and the preview frames.
# Previews: every renders/shots/B8_*/preview was made on 2026-10-17 (04:15-05:19). Code changed afterwards:
#   build_machine.py (10-21, High-NA relayout -> B8_10), shared/blender/styles.py (10-21), materials.py (10-19),
#   shared/tools/mograph.py (10-21, strips fact IDs from screen text). All B8 previews are therefore stale; frames that
#   show "F15b", "F41", "F42 · F60", "F44", "F45", "F46" will lose them on re-render. Contact sheets:
#   renders/review/refs/B8B9/sheets/.
# status: sourced | wrong | unsourced | simplified | artistic   (see docs/WORKFLOW.md 2.3)
# Sources (quotes, URLs, page/slide): research/visual/B8B9_sources.md. HNA [tag] = research/visual/high_na_optics.md.
#   S1  ASML Wilton CT page (reticle stage >15 g, >3 m/s, >10,000 N, car, few pm, maglev)
#       https://www.asml.com/en/company/about-asml/locations/wilton-ct
#   S2  ASML "5 things about High NA" 2024 (4x/8x, half field, 2x exposures, 8 g / 32 g, >185 wph)
#       https://www.asml.com/en/news/stories/2024/5-things-high-na-euv
#   S3  ASML "Mechanics and mechatronics" (60 pm NXT, 20,000/s, maglev tables, opposite directions, nm + ns sync)
#       https://www.asml.com/en/technology/lithography-principles/mechanics-and-mechatronics
#   S4  ASML EUV systems page (wafer positioned to 1/4 nm, adjusted 20,000 times per second)
#       https://www.asml.com/en/products/euv-lithography-systems
#   S5  ASML "Measuring accuracy" (31 TB/week, 3x Hubble a year)
#       https://www.asml.com/en/technology/lithography-principles/measuring-accuracy
#   S6  ASML Mathijssen story 2021 (80 um ~ hair; alignment marks are gratings; TENS of alignment marks; >1,000 = overlay metrology)
#       https://www.asml.com/en/company/stories/2021/fellow-simon-mathijssen-aligning-lithography-nanometer
#   S7  ASML "TWINSCAN 20 years" 2021 (two wafer stages, expose / align+map, swap)
#       https://www.asml.com/en/news/stories/2021/twinscan-20-years-innovation
#   S8  ASML EXE:5000 / EXE:5200B product pages (dual-stage, half field, wph "At dose: 50 mJ/cm²")
#       https://www.asml.com/en/products/euv-lithography-systems/twinscan-exe-5000
#   S9  Maas et al. (ASML), EUVL Workshop 2023 P62 (NXE:3800E >=220 wph, 96 full fields, 30 mJ/cm², >500 W at IF, reticle clamp)
#       https://euvlitho.com/2023/P62.pdf
#   S10 Intel Foundry blog Dec 2025 (EXE:5200B acceptance test: 175 wph, overlay 0.7 nm)
#       https://community.intel.com/t5/Blogs/Intel-Foundry/Systems-Foundry-for-the-AI-Era/How-Collaboration-in-High-NA-EUV-and-Transistor-R-D-Are-Shaping/post/1730050
#   S11 Stoeldraijer et al. (ASML), EUVL Symposium 2009, slide 7 (wafer stage "Dual planar stage + balance mass; E-clamp"; reticle stage "E-clamp", "REMA (X and Y)")
#       https://euvlsymposium.lbl.gov/pdf/2009/pres/O_ET-01_Stoeldraijer_ASML.pdf
#   S12 ZEISS patents US8717541B2 / US7126137B2 (arc-shaped field facets; curved slit = ring-field segment); HNA [Z21] s.11 slit 26 x 1.6 mm² arc
#       https://patents.google.com/patent/US8717541B2/en  https://patents.google.com/patent/US7126137B2/en
#   S13 US5831716A slit-scanning exposure (reticle and wafer scanned in opposite directions at constant speed)
#       https://patents.google.com/patent/US5831716A/en
#   S14 Ruzic group, SPIE ebook ch.18 "Tin Mitigation in EUV Sources" p.751 (68 % max reflectivity; hypothetical 100 W in -> 1 W at wafer; ~10 mirrors; ~1 %)
#       https://cpmi.illinois.edu/files/2023/10/Ch18-1.pdf
#   S15 imec Magazine Jul 2019 "sailing along the stochastic cliffs" (microbridges, broken lines; higher dose does not move the broken-line cliff)
#       https://www.imec-int.com/en/imec-magazine/imec-magazine-july-2019/euv-lithography-sailing-along-the-stochastic-cliffs
#   S16 ASML AR2025 story "1,000-watt ... path to higher productivity"; Hummler et al. SPIE 12953 (2024) ">500W" for "+60 WPH"
#       https://investor.asml.com/annual-reports/2025/strategy-and-stories  https://doi.org/10.1117/12.3010463
#   S17 NIST/CODATA hc = 1239.84198 eV nm; Si a = 543.102 pm; derived Si [110] geometry (dumbbell 135.8 pm, cell 384.0 x 543.1 pm)
#       https://physics.nist.gov/cgi-bin/cuu/Value?hcev  https://www.physics.nist.gov/cuu/pdf/xray_2014.pdf
#   S18 SVMI 300 mm wafer datasheet SV029 citing the SEMI standard (775 um thick; notch 1.0 mm deep, 90°; 3 mm edge exclusion)
#       https://svmi.com/wp-content/uploads/2021/01/SV029.pdf
# Machine depicted = High-NA EXE:5000. NXE numbers (96 fields, 220 wph, 4x, >15 g stage, 10,000 N) must be labelled NXE.
# Glyphs: every non-ASCII character in the B8/B9 mograph text, overlays and VO was rendered in STHeiti (overlay_labels.FONT);
#   none falls back to the .notdef box (nm², mJ/cm², µ/μ, ≈, ≤, →, −, × are all fine; ₂ and ⁰⁶⁻ would fail but are not used).

