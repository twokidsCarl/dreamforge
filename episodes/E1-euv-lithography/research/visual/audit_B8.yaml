B8_02:
- item: 'narration / caption: light is shaped into a narrow slit, not the whole wafer at once; label 狭缝（示意）'
  status: sourced
  source: S3 ("the reticle moves smoothly through a narrow slit of light, exposing only a small part of the pattern at a
    time"); S13; F57
- item: slit formed by two dark knife blades closing over the wafer and squeezing a wide violet glow into a strip
