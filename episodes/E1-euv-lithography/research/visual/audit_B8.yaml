    slit at wafer "26 × 1.6 mm²", drawn as an arc)'
  note: EUV scanners expose through an arc-shaped slit; a straight bar is acceptable only with 示意
  fix: bend SlitLine/SlitBeam into an arc segment (chord = field width), or extend the label to 狭缝（实为弧形 · 示意）
- item: slit length on the wafer 1.0 unit = 100 mm (wafer radius 1.5 units = 150 mm), width 0.12 units = 12 mm
