  source: 'S12 (ZEISS US8717541: "a part ring or arc shape of the field facets can allow well adapted illumination of a
    correspondingly part ring-shaped or arcuate object field"); S11 (masking blades "new REMA (X and Y)" belong to the reticle
    stage / illuminator side)'
  note: the slit shape is made in the illuminator (field facets imaged onto the reticle); the blades frame the field near
    the reticle. Nothing pinches the light above the wafer, and light reaches the wafer only as the converging cone from
    the projection optics
  fix: 'b8_scenes.slit: remove the two blades above the wafer; let the beam arrive from above already slit-shaped (narrow
    converging fan), or move the ''blades'' to a labelled reticle-level plane with caption 照明系统把光整形成弧形狭缝（示意）'
