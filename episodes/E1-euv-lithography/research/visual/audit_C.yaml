# Visual fact audit, segment C (assembly long take: one droplet's light from the plasma to the resist). One row per
# engineering / structural / optical / numeric detail the PICTURE, the on-screen text or the narration shows.
# Checked 2026-10-21 against storyboard.timed.yaml, blender/shots/c_scenes.py, b1_source.py / sample_b1.py (C_02),
# blender/scripts/build_machine.py, shared/blender/styles.py + materials.py, mograph/cd.py (C_07), and the previews.
# status: sourced | wrong | unsourced | simplified | artistic   (see docs/WORKFLOW.md 2.3); `glitch:` = visual defect.
# Sources (quotes in research/visual/CD_sources.md; HNA = high_na_optics.md, ES = euv_source.md, B1-Sn = B1_sources.md):
#   S1  ASML Annual Report 2025 (SEC EDGAR)  https://www.sec.gov/Archives/edgar/data/937966/000162828026011377/asml-2025xannualxreportx.htm
#   S2  ASML AR2025 story "60,000 times per second in our latest commercial sources" (= B1-S3)  https://investor.asml.com/annual-reports/2025/strategy-and-stories
#   S3  Hummler et al. (ASML), Proc. SPIE 12953 (2024) >500 W; Umstadter et al. (ASML), Proc. SPIE 12494 (2023)  https://doi.org/10.1117/12.3010463
#   S4  ZEISS, Kaumanns et al., EUVL Workshop 2024, slides 9 and 13  https://euvlitho.com/2024/P22.pdf
#   S5  ZEISS/ASML, Wischmeier et al., EUVL Workshop 2021, slides 11 and 13  https://euvlitho.com/2021/P52.pdf
#   S6  ASML, van Schoot, EUVL Workshop 2021, slides 34 and 35  https://www.euvlitho.com/2021/P3.pdf
#   S7  ASML, van Schoot, EUVL Workshop 2022, slides 12, 32, 34  https://euvlitho.com/2022/P3.pdf
#   S8  Davydova et al. (ASML), SPIE 11517 (2020); Heil et al. (ZEISS), EUVL Symposium 2015, slides 9/20  https://euvlsymposium.lbl.gov/pdf/2015/Oral_Wednesday/Session9_EUV%20Lithography%20Extendibility/S9.2_Heil.pdf
#   S9  Nikon US 5,831,716 (KrF 248 nm DUV scanner; F57's source)  https://patents.google.com/patent/US5831716A/en
#   S11 ASML "Light and lasers"  https://www.asml.com/en/technology/lithography-principles/light-and-lasers
#   S12 ASML San Diego page  https://asml.com/company/about-asml/locations/san-diego
#   S13 Univ. of Illinois textbook ch.18 (F7, F33)  https://cpmi.illinois.edu/files/2023/10/Ch18-1.pdf
#   S14 Purvis (ASML) 2020 slide 11 far-field annulus (ES §6); Fomenkov et al. 2017 p.176  https://www.degruyterbrill.com/document/doi/10.1515/aot-2017-0029/pdf
# Machine coordinates used below (build_machine.py): PLASMA ≈ (5.73, 0, 1.32), COLLECTOR ≈ (6.26, 0, 1.46), IF (3.6, 0, 0.75),
# RETICLE ≈ (0.24, 0, 3.45), WAFER (0, 0, -1.05); optical platform to x ≈ 9.4, mask/wafer handlers to x ≈ -3.3; CENTER (2.9, 0, 0.8).
# A 35 mm camera 15 m away sees ±7.7 m horizontally.
# EVERY C preview is stale: C_01, C_03-C_06, C_08-C_10 were rendered 10-17 (before the High-NA re-layout of
# build_machine.py on 10-19, so they show the OLD machine and light path); C_02 (10-18) predates the 10-21 B1 source
# fixes; C_07 assembles frames from other stale previews. C_01 (187 of 193 frames) and C_03 (401 of 419) are also
# shorter than their timed durations. Nothing below that depends on framing can be confirmed until re-render.
# Global: build_machine.machine() gives every mirror (collector, fold, facets, PO mirrors), the reticle and the wafer
# M.multilayer_mirror (thin-film rainbow bands). The xray style keeps structure materials, so C_03, C_08 and C_09 show
# rainbow optics (visible in the C_03 preview, frames 1, 219, 256). See C_03.

