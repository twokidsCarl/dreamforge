C_03:
  - item: optical train collector -> IF -> small fold mirror -> field facet mirror (top) -> pupil facet mirror -> reticle (top, face down)
    status: sourced
    source: S4 slide 13; WORKFLOW 2.5; build_machine.PATH
  - item: no bend at the intermediate focus (collector, plasma, IF and the fold mirror direction are collinear)
    status: sourced
    note: SRC_AXIS is defined from FOLD through IF, so the path passes straight through the IF (WORKFLOW s.9 lesson)
  - item: all optics, the reticle and the wafer rendered with materials.multilayer_mirror (radius-dependent thin film 250-900 nm plus a pastel colour ramp) - rainbow bands, kept by the xray style
    status: wrong
    note: "materials.py itself says the rainbow is \"an artistic cue ... not a physical EUV effect\". ASML/ZEISS photos show plain mirror-bright optics (FOM17 Fig.16 collector; audit_B1 B1_15 already fixed the B1 collector). ASML renders the reticle as a dark grey plate (S6 slide 34). The C_03 preview shows the rainbow on the collector (frame 1) and on mirror rims (frames 219, 256); the user has rejected rainbow EUV mirrors before."
    fix: "build_machine.machine(): mirror = M.principled('MachMirror', (0.86, 0.85, 0.82), metallic=1.0, roughness=0.03) (same as build_source.collector); Reticle = dark absorber plate (e.g. principled (0.05, 0.05, 0.06), roughness 0.25); Wafer = one uniform resist-film tint, not radial bands. This also fixes C_08, C_09, B1_28, A3."
  - item: the EUV light drawn as one solid line starting at the collector's centre
    status: simplified
    note: the collector centre is the drive-laser aperture (S14, FOM17 p.176), and the bundle is a hollow cone with a dark centre (S14, PUR20 slide 11). Acceptable as the film's "light path" convention; the B1_21 hollow-cone note applies if a cone is drawn instead
    fix: optional - start the line at BM.PLASMA instead of BM.COLLECTOR (the light leaves the plasma, bounces off the collector annulus, and converges to the IF), or keep the convention and say once in B3 that the line stands for the whole beam
  - item: picture-narration sync
    status: simplified
    fix: re-time the c_scenes._grow keys and camera keys to the cue times in storyboard.timed.yaml (see glitch)
    glitch: "the path grows from 1/N at frame 120 to 4/N (pupil facet mirror) at frame 400. 照明系统… (4.1-6.4 s) plays while the light is still at the IF, and 掩模把电路图形反射出来 (6.8-9.4 s, sim 164-226) while it is at the fold mirror. The reticle is reached only in C_04 (~sim 461). Re-time _grow so the light reaches the facets by ~5 s and the reticle by ~8 s, and end CamC_03 on the reticle."
  - item: storyboard - hundreds of facets flip at once, scatter the light and re-assemble it into a uniform arc
    status: unsourced
    note: "not built yet. ZEISS says only \"actuated facet mirrors\" that set the pupil (illumination shape) (S5 slide 13; F34); the facet count is not public (HNA not-public 10; F34 note). Homogenising comes from the facet arrangement itself (each field facet is imaged onto the slit), not from flipping; showing facets flipping while the light passes implies a per-pulse motion nobody has published."
    fix: if built, keep the facets still while the light passes; show at most one switch of illumination shape labelled 可动分面镜 · 示意; never write a facet count; storyboard text to 分面镜把光分成许多小束、再叠加成均匀的弧形光带
  - item: uniform arc-shaped band of light on the reticle (storyboard)
    status: sourced (if drawn)
    source: S5 slide 11 (slit at the reticle 104 x 12.8 mm², curved; at the wafer 26 x 1.6 mm² arc)
    note: not built; the current picture has only the round rod
  - item: pellicle flashing over the mask (storyboard)
    status: sourced (existence)
    source: S6 slide 34 ("Pellicle + mounting" on the pattern side; pellicle "unchanged vs 0.33NA")
    note: not built; if drawn, put it a few mm below the face-down pattern, with the light passing through it on the way in and out
  - item: circuit pattern (SKY130 lines) appearing in the reflected beam (storyboard)
    status: simplified
    note: not built; SKY130 is a 130 nm open PDK, not an EUV-layer layout - use generic lines labelled 示意 if shown
    fix: if built, use a generic line/space pattern and keep the overlay 示意; do not label it as an EUV layer
  - item: overlays 中间焦点 IF · 示意 (F56) / 可动分面镜 · 示意 (F34)
