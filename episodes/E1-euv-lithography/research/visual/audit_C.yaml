  - item: assembly animation flies every top-level mesh in on its own random path (bolt heads, 26 magnets, 36 motor tiles, isolators, cable trays, seam strips)
    status: artistic
    glitch: 'reads as a swarm of loose debris (preview frames 1-102: small pieces drifting), not "subsystems fly in and lock together"; BM.attach_small() exists for exactly this but assemble() does not call it'
    fix: in c_scenes.assemble call hosts = BM.attach_small(new) and animate only the hosts (source, illum, reticle, po, wafer, base), ideally in the four ASML test modules (A0_10, S7 slide 34)
  - item: camera ends pushed in to the source-module entrance (storyboard; last frame = first frame of C_02)
    status: wrong
    note: "CamC_01 last key aims at (-4.8, 0, 0) from (-9.5, -5.5, 1.6), i.e. at the mask-handler / wafer-handler end. In the High-NA layout the source is at +x (PLASMA ≈ 5.7); the camera ends looking away from it (keys were written for the old layout where the source sat on -x, as the stale preview shows)"
    fix: "re-key CamC_01 on BM constants: start wide on BM.CENTER, orbit, end aimed at the source drum (≈ BM.PLASMA + (0.3, 0, 0)) from about (9.0, -4.5, 2.2), so the cut to C_02 (inside the vessel) is motivated"
