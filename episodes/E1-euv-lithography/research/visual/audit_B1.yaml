    status: sourced
    source: ES §5 (SW17 slide 35 "Ellipsoidal design • Plasma at first focus ... intermediate focus"); light_rays() uses the focal property
  - item: collector depth / diameter about 0.29, small central hole (about 1/9 of the diameter)
    status: simplified
    source: S10 (FOM17 Fig.16 / SW17 slide 35 photos, a deep bowl, matches); the hole size is not public (ES not-public 2), drawn as a plausible fit
  - item: drive-laser entry port at the back of the vessel, on the collector axis
    status: sourced
    source: ES §2 (FOM17 p.176 "propagates through a central aperture in the collector")
  - item: droplet generator port on the side, perpendicular to the collector axis
    status: sourced
    source: ES §1 (POS16 x along the droplets, z along the collector axis)
  - item: droplet catcher opposite the generator
    status: wrong
    note: missing. build_vacuum.source_vessel has a generator port at -Y but nothing at +Y; real vessels have the catcher diametrically opposite (SW17 slide 28, POS16 "Tin catch")
    fix: add a catcher port and module at (0, +r+0.5, 0) and give it a label, or at least draw it
  - item: vessel orientation (collector axis horizontal on screen, IF to the side)
    status: simplified
    note: real NXE vessel has a "62 degree orientation", collector at the bottom "facing up against gravity", IF on top (ES §5-6). There is no floor in this shot, so roll CamB1_02 until the IF points up-right at about 60 deg; then no viewer is misled.
