# Visual fact audit, segment B1 (EUV light source). One row per engineering / structural / optical detail the PICTURE or
# on-screen text shows (narration numbers live in research/facts.yaml). Checked 2026-10-21.
# status: sourced | wrong | unsourced | simplified | artistic   (see docs/WORKFLOW.md 2.3)
# Sources: S-numbers = research/visual/B1_sources.md; ES §n = research/visual/euv_source.md.
# Scale note for the b1_source simulation (sample_b1.py / build_source.py): 1 unit = 125 um. The droplet (25 um) and
# pancake (300 um) are to scale; the collector (rim diameter 1.6 mm, real 650 mm), the nozzle (1.75 mm from the plasma)
# and the droplet spacing (3.0 units = 375 um, real 1.4-1.5 mm) are not.
# Previews reviewed via 3x3 contact sheets in renders/review/refs/B1/sheets/. Stale previews (made before later code
# changes) are flagged under `glitch`.

