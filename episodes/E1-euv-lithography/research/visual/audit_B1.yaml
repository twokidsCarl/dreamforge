B1_10:
  - item: pre-pulse from behind the collector flattens the droplet into a sheet facing the laser
    status: sourced
    source: S1, S5, ES §3 (FOM17 Fig.13B; PM351 "dominant expansion orthogonal to the incident beam")
  - item: sheet diameter 300 um (12x the droplet), caption 预脉冲：薄饼直径约 300 μm（锡滴约 25 μm）
    status: sourced
    source: F4b (TOR20 "about 300 μm"); PUR20 slide 23 "Target Diameter 400µm"
  - item: sheet thickness 6 um at the centre, 21 um at the rim, plus 10 um displacement ripples (it reads as a thick lens / coin)
    status: wrong
    note: ARCNL measured "a thickness of just several tens of nanometers" with a "bounding rim" (S13). Mass conservation gives a 0.12 um mean, so the mesh is about 50-100x too thick.
    fix: build_source.pancake half-thickness about 0.0004 units at the centre (visually a hairline), a beaded rim about 2-4 um, ripple strength at or below 0.005; give it the satin/rough tin of _cold_open so it does not mirror blotches
  - item: pre-pulse beam radius 0.12 units (30 um diameter); main-pulse beam radius 0.7 (175 um diameter)
    status: wrong
    note: PUR20 slide 23 "Beam Diameter 100µm" (PP) and "Beam Diameter 400µm / Target Diameter 400µm" (MP). As drawn, the main pulse is narrower than the 300 um sheet, which contradicts B1_16 (薄盘接住整个光斑).
    fix: PrePulse radius 0.4, MainPulse radius 1.6 (or at least 1.2 = the sheet radius); draw both as converging cones toward the focus (FOM17 p.176 "focused to a minimum spot size") rather than cylinders
  - item: sheet drifts +x (along the laser, away from the collector) by 44 um and stays on the droplet path
    status: simplified
    note: the push along +laser is real (KUR16 U 0.5-350 m/s; ejecta go back toward the laser, S14). Missing is the downstream motion along the droplet path, about 160-300 um before the main pulse (80 m/s x 2-4 us; PUR20 slide 23 MP about 300 um downstream). The backlog note is half right.
    fix: key the sheet along +y by about 1.6-2.4 units between T_PRE and T_MAIN, plus the existing small +x push; put the main-pulse axis at that downstream point
  - item: droplet growth and concentric ripples in slow motion
    status: artistic
  - glitch: blotchy mirror reflections on the sheet (WORKFLOW s.9 "薄盘表面一团团斑驳"). The satin fix exists only in _cold_open; apply it to B1_10, B1_12 and B1_13.

