B1_03:
  - item: tin droplets flying horizontally across the collector axis, generator to plasma site
    status: sourced
    source: ES §1, S1
  - item: droplet spacing 375 um (15 droplet diameters)
    status: wrong
    note: real spacing is 70 m/s / 50 kHz = 1.4 mm (FOM17 p.180 "1.5-mm droplet-to-droplet spacing", S10), about 56 diameters. B1_07 states 1.4 mm on screen, so the picture contradicts its own caption. The same error shows in B1_08, B1_10, B1_12 and B1_21 (the next droplet sits right beside the 300 um sheet).
    fix: sample_b1.py spacing = 11.2 units (1.4 mm); keep at most one or two droplets in macro frames
  - item: nozzle tip 1.75 mm from the plasma (14 units), inside the frame together with the plasma site
    status: wrong
    note: the installed distance is not public, but the generator sits on the vessel flank outside a 650 mm collector (SW17 slide 28, POS16), so it is at least about 0.3 m away (derived, S-notpublic). Demonstrations image droplets 200-300 mm from the nozzle (ES §1).
    fix: move the nozzle out of every shot that also shows the plasma site (B1_03, B1_08, B1_21, B2/B3 reuse), or label the shot 示意 · 非比例
  - item: dark chamber walls, ribs, ports, LED bokeh
    status: artistic
    source: build_vacuum.py docstring ("purely stylised")

B1_04:
  - item: nozzle tip "外形示意" plus caption 喷嘴内径 3–5 μm（按 ASML 专利描述 · 示意）
    status: sourced (caption) / simplified (shape)
    source: S8 (US9715174 "inner diameter of 3-5 μm"); S9 (orifice at the end of a capillary tube)
  - item: visible end face of the nozzle reads as an open bore about 30 um across, as large as a droplet
    status: sourced
    resolved: "2026-10-21: b1_jet.nozzle() flat matte end face 30 um across with a 4 um dark orifice (R_BORE 0.016)"
    note: the cone is capped at radius 0.12 units (15 um), and the bevel/reflection makes the whole face look like an opening. This contradicts the 3-5 um caption, which says the bore is several times smaller than the droplet.
    fix: model a 4 um orifice (radius 0.016 units) as a dark pinhole in a flat, matte end face; keep the tip outer diameter at least 5x the bore
  - item: no jet at the orifice; full-size 25 um droplets appear right next to the tip
    status: sourced
    resolved: "2026-10-21: B1_04 now renders b1_jet: a 3.2 um jet leaves the orifice and breaks up ~75 um out; no full-size droplets in frame"
    note: FOM17 Fig.10 and US9715174 show a continuous jet about as thick as the nozzle, which breaks into tiny droplets that coalesce only "at some distance away from the nozzle" (S8, S10). The storyboard also asks for a hair-thin jet.
    fix: emit a 3-5 um jet from the orifice in CamB1_04 (reuse the b1_jet metaball emitter at real proportions); no full-size droplets in this frame

