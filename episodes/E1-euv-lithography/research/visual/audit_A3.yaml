    note: code now wraps the bench in a transmissive cylinder (VacChamber, IOR 1.05) with two dark end flanges, but in the picture nothing reads as a vacuum chamber - a featureless light-grey surround and two black discs at the frame edges; a viewer still sees a beam crossing an open grey studio
    fix: make the chamber legible - matte or brushed-steel chamber wall seen from inside with a round viewport / CF ports / bellows (or camera outside looking through a visible viewport rim), or put 真空中 · 示意 into the A3_04 overlay (storyboard overlay text, drawn by edit_film)
    verified: "2026-10-22: a23_scenes.lens() has VacChamber + VacFlange; frames 1, 60, 150 show uniform light grey background, black flange disc at left edge (and right edge from frame 121); no chamber wall, port or viewport readable. NOT fixed in the picture"
  - item: Mo/Si multilayer mirror replaces the lens and reflects the beam (EUV mirrors are glass substrates with a Mo/Si coating)
    status: sourced
    source: S3 ("several multilayer mirrors instead of lenses"); S2 ("thin layers of silicon and molybdenum ... vapor-deposited onto the glass surface ... up to 100 layers")
    verified: "2026-10-22: frames 112-195 the mirror slides in, the beam reflects from it"
  - item: reflected beam as bright as the incoming beam
    status: simplified
    source: 'S2 ("a reflectivity that makes up to 70 percent of the light usable"); S6 CXRO multilayer calc, Mo/Si d=6.9 nm, 40 bilayers, normal incidence: R=0.729 at 13.5 nm (ideal interfaces)'
    note: code sets the outgoing emission to 8.0 x 0.7 = 5.6, but both beams clip to the same white core in the render, so the 30 % loss does not read; the ledger from B4 on carries the number
    fix: lower both emissions (e.g. 2.5 and 1.75) so neither clips and the outgoing beam is visibly dimmer (see clipped-beam glitch below)
    verified: "2026-10-22: code A3BeamReflected 8.0*0.7; frames 145, 170, 195 incoming and outgoing beams both near-white, no visible difference"
  - item: angle of incidence 25 deg (normal bisects incoming +X and outgoing 50 deg up-left)
    status: simplified
    source: S6 - a 6.9 nm normal-incidence Mo/Si stack at 25 deg reflects only ~1 % at 13.5 nm; a stack tuned for 25 deg (d~7.6 nm) reaches ~57 % at 13.5 nm; EUV imaging mirrors work near normal incidence (high_na_optics.md - CRAO 5.4 deg at the mask)
    note: physically possible only with a mirror designed for that angle; not wrong for a generic demo, but closer to normal incidence reads truer
    fix: optional - reduce AOI to ~10 deg (outgoing beam 20 deg from the incoming); then nothing to footnote
    verified: "2026-10-22: unchanged - mirror rot 90+25 deg, outgoing beam 50 deg up-left (frames 145-195)"
