    status: sourced
    source: S3 ASML EUV systems page ("EUV light is absorbed by everything, even air"); S2 ZEISS ("absorbed by all materials – including air")
    note: 几乎 is a fair softening (multilayer mirrors reflect, thin pellicles partly transmit)
