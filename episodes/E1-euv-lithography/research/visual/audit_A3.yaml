    status: artistic
    source: 'S4 CXRO gas transmission - air, 760 Torr, 295 K, 13.5 nm: 49.9 % left after 0.1 mm, 0.096 % after 1 mm (attenuation length ~0.14 mm)'
    note: physics matches (Beer-Lambert absorption by N2/O2), but molecule size/spacing and the screen-width path length are not to scale - in real air the beam is gone within about a millimetre; violet = film colour code for EUV. 示意 is on screen
    verified: "2026-10-22: frames 20-60 the beam narrows and fades as molecules flash; 示意 bottom right (18 px at 1080p, house size, small but legible). Render faults logged as new glitch items below"
  - item: on-screen "示意 · F10" bottom right
    status: sourced
    note: the source string still says "示意 · F10" in mograph/a3.py, but mograph.screen_text() strips fact IDs with their separator, so only 示意 is drawn
    verified: "2026-10-22: crop of frame 90 bottom right shows 示意 only, no F10"
  - item: storyboard says 3D (build_vacuum.gas_absorption, eevee); rendered as 2D mograph
    status: artistic
    note: production note only, no factual impact
    verified: "2026-10-22: still 2D (mograph/a3.py problem2); storyboard still lists style energy / eevee / build_vacuum.gas_absorption"
  - item: (new 2026-10-22) beam drawn as 20 px line segments of stepped width; the first ~40 % is a flat light-grey/white bar, not violet
    status: glitch
    note: frames 20, 60 - zoom shows a staircase of rectangular segments with visible seams and a near-white core (200,170,255 at width 26 + glow clips); reads as a white tube rather than the film's EUV violet
    fix: in problem2() draw the beam as one polygon whose half-width follows exp(-hits/9) smoothly (or many 2 px steps with round caps), core colour VIOLET at reduced glow gain so it stays violet; no hard width steps
  - item: (new 2026-10-22) molecules keep flashing where the beam has already faded to nothing, and the last 3-4 molecules on the right stay lit until the end of the shot
    status: glitch
    note: frames 60-100 molecules at x ~1500-1800 (1080p) flash although the drawn beam ended near x ~600; frames 100-137 four molecules at the right edge glow continuously because the front stops at x=1800 and flash = 1-(front-x)/160 never decays. Contradicts the point (the light is gone)
    fix: scale each flash by the local beam level lv at that molecule (flash *= exp(-hits_before_x/9)) and make it time-based (decay over ~0.3 s after the front passes) so nothing stays lit once the front stops
A3_04:
  - item: glass lens - violet beam stops at the entry surface
    status: sourced
    source: S2 ZEISS ("absorbed by all materials"); S5 CXRO attenuation length of SiO2 (2.2 g/cm3) at 13.5 nm = 0.0997 um, i.e. ~100 nm
    note: the light is gone within the first ~0.1 um of glass, so ending the beam at the surface is right
    verified: "2026-10-22: frames 24-90 the beam ends at the lens's entry face"
  - item: warm orange glow ring at the entry point
    status: artistic
    note: absorbed EUV becomes heat, but glass would not visibly glow at scanner power levels
    fix: no longer visible (see verified); if a heat cue is wanted, put it on the camera side of the lens. The torus left behind is logged as a glitch below
    verified: "2026-10-22: frames 40, 60, 90 crops - no orange anywhere; the camera (x=+2.4) looks at the lens's exit side, the entry ring sits on the far face behind the opaque-looking lens. Only a violet-white bloom at the beam end"
