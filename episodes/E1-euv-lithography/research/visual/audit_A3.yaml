# Visual fact audit, segment A3 (the three hard problems + 17 years / EUR 6 bn). One row per technical or
# historical detail the PICTURE or on-screen text shows (narration numbers live in research/facts.yaml). status:
#   sourced    - matches a primary source cited here
#   wrong      - contradicts a source; must change
#   unsourced  - invented or unchecked
#   simplified - deliberate simplification; difference from reality and where it is corrected
#   artistic   - deliberate convention, flagged on screen as 示意 where a viewer could take it literally
#   glitch     - render / layout fault (not a fact question); must be fixed before final
# Quotes, URLs and CXRO query parameters: research/visual/A3_sources.md (S1-S12). Audited 2026-10-21 against the
# storyboard (p1_A0-B1.yaml), blender/shots/a23_scenes.py, mograph/a3.py and the preview frames in renders/shots/A3_*.
