# Visual fact audit, segment D (ending). One row per engineering / structural / numeric detail the PICTURE, the
# on-screen text or the narration shows. Checked 2026-10-21 against storyboard.timed.yaml, blender/shots/d_scenes.py,
# b1_source.py (D_08/D_09), mograph/cd.py (D_02-D_05, D_10), mograph/a0.py (chip_dive), blender/textures/make_worldmap.py
# and the previews. status: sourced | wrong | unsourced | simplified | artistic (docs/WORKFLOW.md 2.3); `glitch:` = defect.
#   status glitch = rendering / readability problem still open; status fixed = glitch seen resolved by the verification pass
# Sources (quotes in research/visual/CD_sources.md; same numbering as audit_C.yaml):
#   S1  ASML Annual Report 2025 (SEC EDGAR)  https://www.sec.gov/Archives/edgar/data/937966/000162828026011377/asml-2025xannualxreportx.htm
#   S2  ASML AR2025 story "60,000 times per second in our latest commercial sources" (= B1-S3)  https://investor.asml.com/annual-reports/2025/strategy-and-stories
#   S3  Hummler et al. (ASML), Proc. SPIE 12953 (2024) ">500W"; Umstadter et al. (ASML), Proc. SPIE 12494 (2023) "~250 Watt"  https://doi.org/10.1117/12.3010463 , https://doi.org/10.1117/12.2657772
#   S10 ZEISS EUV page (F19, "184 billion components ... slightly larger than a fingertip")  https://www.zeiss.com/semiconductor-manufacturing-technology/inspiring-technology/euv-lithography.html
#   S11 ASML "Light and lasers" (25 um, two pulses)  https://www.asml.com/en/technology/lithography-principles/light-and-lasers
#   S13 Univ. of Illinois textbook ch.18 (F7 "about 10 mirrors")  https://cpmi.illinois.edu/files/2023/10/Ch18-1.pdf
#   S15 Asyst/Murata US 7,410,340 (OHT cable hoist lowers a FOUP onto the load port at ~900 mm)  https://patents.google.com/patent/US7410340B2/en
#   S16 Miraial FOUP / FOSB product pages (26 slots, PC; FOSB 389.5 x 327 x 341.8 mm)  https://www.miraial.co.jp/en/product/kt-3003/
#   S17 DLR clean room PR-13 (yellow light protects UV-sensitive resist)  https://www.dlr.de/en/images/large-scale-research-facilities/clean-room-pr-13/
#   S18 Intel on the EXE:5000 ("as big as a double-decker bus"), via high_na_optics.md §3.2
#   chips.md (Zen 5 CCD, TSMC 4 nm, CC0 photo), shipment_suppliers.md B1 (AR2025 p.239 supplier regions)
# EVERY D preview is stale: D_01/D_06/D_07 (10-18) predate d_scenes.py changes of 10-21 (D_07 still shows the old
# cylinder people) and are 8-9 frames shorter than their timed durations (D_01 111/119, D_06 75/83, D_07 145/154);
# D_02-D_05 and D_10 (10-18 09:15) predate cd.py of 10-21 (they still show 据报道 / 行业估算 / 600 W); D_08 (10-18) and
# D_09 (10-17) predate the 10-21 B1 source fixes. Re-render all before the next review.
# 2D shots (D_02-D_05, D_10) get no edit_film label: their storyboard `overlays` are documentation only, the
# text that viewers see is what cd.py draws.
# VERIFIED 2026-10-22 (research/visual/verify_B2-D.md): fresh sample renders renders/shots/D_*/sample (960x540,
# rendered 09:00-09:12 on 10-22, after d_scenes.py 01:00, cd.py 00:41 and the b1_source D_08/D_09 changes; frame
# counts = timed durations). Labels / chapter card checked by running edit_film functions on sample frames.

D_01:
  - item: yellow-lit clean-room bay
    status: sourced
    source: S17 ("Yellow lighting prevents accidental exposure of UV-sensitive photoresist layer")
    note: stylised; no specific fab copied (project rule). Which tool the pod comes from is not specified, which is right - an EUV scanner normally receives wafers through its track, but that is not shown or claimed
  - item: load-port plate at 0.9 m height
    status: sourced
    source: S15 ("lowers a FOUP onto the kinematic plate of the load port at approximately 900 mm height")
  - item: wafer pod = plain amber translucent box 0.42 x 0.38 x 0.34 m with bevelled edges; no front door, latch keys or top handling flange
    status: simplified
    source: 'S16 (FOUP: 26 slots, PC shell; FOSB 389.5 x 327 x 341.8 mm as a size reference); SEMI E47.1 envelope not public free of charge'
    note: size is plausible; an OHT grips the pod by its top flange, so the flange should exist for the hoist to make sense
    fix: add a top handling flange (thin mushroom plate on a short neck) and a darker front door face toward the tool
    verified: "2026-10-22: flange and door added - frames 1-60 each pod carries a thin plate on a short neck and a dark door face toward the tool; the gripper closes on the flange (frame 45). Envelope still approximate (simplified)."
  - item: the hero pod "slides out" of the tool face by 0.5 m (keys y 1.1 → 0.6), starting half inside the tool wall
    status: sourced
    note: a FOUP sits on the load port outside the tool and only docks/undocks against the port opening; it never comes out of the machine (S15). The undock stroke is not public
    fix: "d_scenes.foup: start the pod on the load-port plate at y ≈ 0.75 (front face against the tool face at 1.1 - 0.35), undock by ≤ 0.08 (示意), then the hoist lifts it"
    verified: "2026-10-22: fixed - frames 1-31 the pod rests on the load port; it only leaves when the gripper lifts it (45-60)."
  - item: overhead hoist lifts the pod 1.8 m to the rail; pods behind travel along the rail at z 2.9
    status: sourced
    note: "an OHT vehicle runs on the rail and lowers a gripper on a cable hoist onto the pod (S15 \"cable hoist vehicles\"). In the code the hoist box never descends and the pod rises with nothing attached (preview frames 61-71: the pod floats in mid-air); the five pods behind hang in the air with no vehicles at all"
    fix: lower a gripper plate on 2-4 thin belts from the hoist to the pod top (keys 30-50), lift with the belts shortening; give every following pod its own hoist vehicle on the rail, carried inside or just under it
    verified: "2026-10-22: fixed - four belts lower a gripper (frames 31-45), the pod rises on them (60) into its vehicle (75), and every pod on the rail hangs under its own vehicle (89-119)."
  - item: chapter card 章节 · 收束：回到那一滴锡
    status: fixed
    glitch: kind chapter overlays are never drawn (edit_film skips them; see audit_C C_01)
    verified: "2026-10-22: edit_film.draw_chapter composited on D_01 sample frame 36 renders 章节 / 收束 / 回到那一滴锡 lower left over the yellow room (0.2-2.8 s)."
  - item: preview
    status: fixed
    glitch: stale (10-18) and 8 frames short (111 of 119)
    verified: "2026-10-22: fresh sample, 119 frames = 4.96 s."

