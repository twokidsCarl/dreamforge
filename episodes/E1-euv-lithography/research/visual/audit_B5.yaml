B5_05:
  - item: the facets of the moving wall themselves light up in the shape of a ring, then two poles
    status: wrong
    source: S8 s.4-5, S9 s.36, S6 s.13 (the actuated facets are the field facets; tilting one selects WHICH pupil facet it lights - the ring or dipole appears as the lit round facets of the separate pupil facet mirror, red in the drawings)
    note: the field facet mirror never shows the pupil pattern; the shot presents the wrong mechanism of the one subsystem B5 is about
    fix: b5_scenes.facets() - keep the arc-facet wall tilting and add a second plate of round pupil facets on which the lit facets spell ring → dipole (or relabel the wall as the pupil facet mirror and show the tilting on a separate field-facet plate); light the pattern by beams from the tilted facets, not by the facets facing the camera
  - item: stadium-wave flip across the wall
    status: artistic
  - glitch: frames 1-30 are almost black; afterwards the 26 x 18 square grid reads as a pixel display

