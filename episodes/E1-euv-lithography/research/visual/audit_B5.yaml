# Visual fact audit, segment B5 (the illuminator: facet mirrors, pupil shapes). One row per engineering /
# structural / optical / numeric detail the PICTURE, the on-screen text or the narration shows. Checked 2026-10-21
# against storyboard.timed.yaml, blender/shots/b5_scenes.py (+ build_machine), mograph/b5.py and the preview frames
# in renders/shots/B5_* (3x3 contact sheets in renders/review/refs/B4B5/sheets/).
# status: sourced | wrong | unsourced | simplified | artistic   (see docs/WORKFLOW.md 2.3)
# Quotes for every S-number: research/visual/B4B5_sources.md (same numbering as audit_B4.yaml). HNO = high_na_optics.md,
# ES = euv_source.md.
# Sources:
#   S1  ZEISS SMT "EUV lithography" page (A) https://www.zeiss.com/semiconductor-manufacturing-technology/inspiring-technology/euv-lithography.html
#   S2  ZEISS SMT "High-NA-EUV lithography" (A) https://www.zeiss.com/semiconductor-manufacturing-technology/inspiring-technology/high-na-euv-lithography.html
#   S3  ZEISS SMT magazine "High-NA-EUV lithography" (A) https://www.zeiss.com/semiconductor-manufacturing-technology/smt-magazine/high-na-euv-lithography.html
#   S5  ZEISS Bihr et al., EUVL Workshop 2022 (A) https://euvlitho.com/2022/P53.pdf
#   S6  ZEISS/ASML Wischmeier et al., EUVL Workshop 2021 (A) https://euvlitho.com/2021/P52.pdf
#   S7  ZEISS Kaumanns et al., EUVL Workshop 2024 (A) https://euvlitho.com/2024/P22.pdf
#   S8  ZEISS/ASML Liddle et al., EUVL Workshop 2017 (A) https://www.euvlitho.com/2017/P23.pdf
#   S9  ASML van Schoot, EUVL Workshop 2022 (A) https://euvlitho.com/2022/P3.pdf
#   S10 ZEISS Kaiser, VLSI-TSA 2019 (A) https://www.euvlitho.com/2019/P24.pdf
#   C11 ZEISS Conradi et al., EUVL Symposium 2011 (A) https://euvlsymposium.lbl.gov/pdf/2011/pres/Olaf%20Conradi.pdf
#   PUR20 ASML Purvis, STROBE 2020 (A) via euv_source.md §6
# Stale previews: all B5 previews are dated 10-17. B5_01 and B5_09 show the superseded machine (build_machine was
# re-laid out for the EXE:5000 on 10-19) and must be re-framed and re-rendered (audit_backlog.yaml ALL). The 2D
# previews show fact IDs that mograph.screen_text now strips.
# Generation mixing: the "lossless / 100 % efficiency" statement (B5_07) and the B5_08 pitches are ZEISS's NXE
# (Starlith 3300/3400) data; ZEISS only says the High-NA illuminator reuses that technology.

B5_01:
  - item: x-ray machine, violet path from the intermediate focus into the illuminator, reticle stage above; overlay 照明系统（示意）
    status: sourced
    source: HNO §2 and §3.1; S7 s.13 (current 0.55 NA - IF, small fold mirror, field facet mirror on top, pupil facet mirror below, then the reticle); S9 s.36; build_machine PATH follows these
  - item: illuminator drawn with three mirrors (fold, field facet, pupil facet)
    status: simplified
    note: taken from stylised ZEISS renders [M]; the real EXE illuminator mirror count is not public (HNO §5 item 3); 示意 on screen covers it
  - item: camera keys
    status: wrong
    note: CamB5_01 ends on (-1.45, 0, 1.2), a hard-coded point from the pre-10-19 layout; the illuminator now sits at x ≈ 1.75-2.85 (BM.FACET1, BM.FOLD), so the last frame centres the projection-optics column instead of the illuminator
    fix: b5_scenes.machine() - aim CamB5_01 at the mean of BM.ILLUM (or BM.FACET1) and derive eye points from BM.CENTER, then re-render
  - item: path growth stops at PATH index 3 (FACET1, the field facet mirror) although the comment says FACET2
    status: simplified
    glitch: the field-facet → pupil-facet leg never lights, in B5_01 or in B5_09, where the dipole then starts from the dark pupil facet mirror; use 4 / (len(BM.PATH) - 1)
  - item: mirrors use materials.multilayer_mirror (rainbow bands)
    status: wrong
    note: as audit_B4.yaml B4_04 (S10 s.18, S6 s.19, S9 s.39 - EUV mirrors look like plain mirrors); check whether the xray style overrides it, otherwise fix the material
  - glitch: the 10-17 preview is the old machine - the path kinks in empty space near the frame centre (frame 41) and runs into a vertical zig-zag of small mirrors; stale

B5_02:
  - item: overlay 照明系统 NXE：1.5 万零件 · 1.5 吨 → High-NA：2.5 万+ 零件 · 6 吨以上
    status: sourced
    source: S1 ("15,000 individual parts weighing 1.5 tonnes"); S2 ("more than 25,000 parts and weighs over six tons"; "around six tons – four times more than before"); S3; S7 s.8
  - item: narration 它的任务，是把光变得极其均匀，再按需要整形
    status: sourced
    source: S1 ("the EUV light from the source is converted into the appropriate illumination for the structures on the mask"); S8 s.4 ("Actuated fly's eye unit" - a fly's-eye integrator homogenises; "Standard pupil shapes")
    note: the shot lists F18 as its fact; F34 is the one that covers the shaping
  - item: two facet mirrors in sequence, field facet mirror then pupil facet mirror
    status: sourced
    source: S8 s.4, S9 s.36, S6 s.13
  - item: both plates built from identical square facets (9 x 7 grid each)
    status: wrong
    source: "S8 s.4, S9 s.36, S6 s.13 (field facets are long curved arc-shaped strips on an elliptical carrier; pupil facets are small round mirrors on short cylinders); HNO §1.5 (the field facets are imaged onto the arc-shaped slit, 104 x 12.8 mm at the reticle)"
    fix: b5_scenes._plate() - field plate = elliptical carrier with ~12-16 thin arc-shaped facets (aspect ratio ≥ 8:1); pupil plate = grid of round facets
  - item: light arrives at the field facets as a near-parallel bundle from a 0.5-radius disc
    status: wrong
    source: S8 s.4, S9 s.36 (the beam diverges in a cone from the intermediate focus, a point, to the field facet mirror)
    fix: start the RIn rays at one point (the IF) and fan them out to the field facets
  - item: each pupil facet sends one thin ray to a random point of the exit field
    status: simplified
    note: in a fly's-eye each pupil facet images its field facet onto the whole slit, so every channel covers the full field - that is why the field becomes uniform; one ray per channel to a random spot shows the opposite
    fix: from each pupil facet draw a thin cone (or rays to the four corners) covering the whole OUT patch
  - item: facets with rainbow multilayer material
    status: wrong
    note: as B4_04
  - item: no fold mirror between the IF and the field facet mirror
    status: simplified
    note: S7 s.13 shows one in the 0.55 NA layout; 内部结构示意 is on screen
  - glitch: a black slab (housing edge) intrudes at the top right of frames 1-71; pale lavender rays on a light grey ghost-glass background have little contrast

B5_03:
  - item: intensity as a terrain - random peaks and valleys flattened into a mesa; overlay 不均匀 → 均匀（示意）
    status: simplified
    source: ES §6 (PUR20 slide 11 far field at the IF - an annulus with a dark centre and a dark horizontal band); HNO §1.5 (the uniform field is an arc-shaped slit, 26 x 1.6 mm at the wafer, 104 x 12.8 mm at the reticle)
    note: real input non-uniformity is a ring with a dark centre, not random hills; the flat end state is a square rather than a slit
    fix: optional - make the input a ring with a dark centre and the end mesa a curved slit; 示意 already on screen

