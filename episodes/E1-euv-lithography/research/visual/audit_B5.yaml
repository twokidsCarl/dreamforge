B5_09:
  - item: dipole light leaving the illuminator and climbing to the reticle, drawn as two parallel strands 0.24 apart from FACET2 to RETICLE that hit the reticle at two different points
    status: sourced
    source: S9 s.36 (pupil @ mask - a dipole is two lit regions of the pupil, i.e. two directions of light); S8 s.4 (every pupil facet illuminates the same field)
    note: a dipole is an angular distribution - light from two separated lit regions of the pupil facet mirror converges onto the SAME illuminated slit on the mask from two directions. Two parallel beams landing side by side say there are two separate illuminated spots
    fix: b5_scenes.machine() - start the two Pole strands at two points on the pupil facet mirror (±offset across the plate) and end both at BM.RETICLE
    verified: "2026-10-22: fixed - Pole strands from FACET2 ± 0.16 across the plate to the single BM.RETICLE point; frames 16-120 two strands converge on one spot of the mask."
