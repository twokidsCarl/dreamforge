A2_10:
  - item: the violet light pen flickers and goes out
    status: artistic
    note: render bug, not fact - pen_fails() uses fade(t, 0.0, 0.2, dur, 0.05), which is 1 only inside [0, 0.2 s]; 128 of 132 preview frames are pure black (750-byte PNGs), so the flicker never shows. Fix - fade(t, 0.0, dur, dur, 0.05)
    verified: "2026-10-22: fixed - code uses fade(t, 0.0, dur, dur, 0.05); the pen is visible frames 2-16 steady, flickers frames 17-62 (peak brightness per frame 127-242, random per frame), dims out by frame ~100, a faint ember at frames 100-113, black from ~118 to 124 (the half-second silence)"
