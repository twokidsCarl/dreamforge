  - item: "NEW 2026-10-22: in stage 3 the bar chases left (chase = total - 1700) and the legend 涂胶 · 曝光 · 刻蚀 travels with it, so it is cut at the left frame edge - frame 171 reads 胶 · 曝光 · 刻蚀, frame 188 only 曝光 · 刻蚀 partly; the bar also stops inside the frame instead of 冲出画面右侧 as the storyboard says"
