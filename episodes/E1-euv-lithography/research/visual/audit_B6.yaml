    note: the change is uncommitted and the B6_02 preview (10-17) predates it, so re-render
  - item: 20 Mo/Si pairs
    status: simplified
    source: S8 ("number of repeating units becomes 30 to 60"); TSMC US 8,691,476 ("forty pairs")
    note: the camera never shows the bottom of the stack, so the count is not read; acceptable
  - item: absorber blocks 0.52 units tall on a 0.22-unit period (about 16 nm if the period is 6.8 nm)
    status: wrong
    source: S7 slides 8 and 11 (reference TaBN / "60nm Ta"); S8 gives 20-50 nm for its absorber
    fix: "b6_scenes.section(): absorber height 1.9 units (60 nm at this scale), centre z 0.95; on_absorber test and z_hit (0.52) follow"
  - item: absorber lines 0.6 wide at 1.2 pitch (19 nm lines at 38 nm pitch on the mask = 9.5 nm pitch on the wafer)
    status: wrong
    source: S1 (4x reduction; NXE resolution 13 nm, i.e. >= 26 nm wafer pitch -> >= 104 nm mask pitch)
    fix: "absorber pitch >= 3.3 units (104 nm), width ~1.6; fewer, wider blocks (e.g. xs = -3.3, 0, 3.3) so a viewer sees the absorber is several layers thick and much wider than a layer"
  - glitch: the absorber blocks are only on screen around frames 60-70; the dive (frames 79-127) ends inside the bare stack, so the promised 一排深色的吸收层方块 is barely seen. End the move on a frame that shows absorber and stack together.

B6_03:
