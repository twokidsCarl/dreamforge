    status: simplified
    source: S14 slide 20 ("CRAO = 6°" for NXE 3300); S13 slide 11; S10 slide 9
    note: 6 deg is the NXE value; the High-NA machine the film follows uses 5.4 deg (S10; ASML ~5.3 deg, S11 slide 34). Shown unlabelled in a film about the EXE, it reads as the EXE value.
    fix: "mograph/b6.py incidence(): heading 入射角 ≈ 6°（NXE，主光线相对法线）; storyboard overlay NXE：入射角 ≈ 6°. Narration may stay (B7_11 gives 6 -> 5.4)."
  - item: cone half-angle 2.6 deg (cone_diagram default half_deg=2.6)
    status: wrong
    source: "D: NXE mask-side NA = 0.33/4 -> asin = 4.73 deg (S1 NA 0.33, 4x). B7_07/08 draw the same NA with 4.73 deg, so the film contradicts itself."
    fix: "cone_diagram(c, t, a, 6.0, '≈ 6°', half_deg=4.73) in incidence(). The two cones then sit only ~2.6 deg apart, which also sets up B7_07."
  - item: violet/white stripes in the reflected cone (pattern carried by the light)
    status: artistic
  - glitch: stale preview heading shows "F40" (screen_text now strips it); re-render

B6_05:
