    status: simplified
    source: S4 ("intentionally deforming the patterns"); S9 (hammerheads, serifs at line ends)
    note: a continuous sinusoidal width modulation along long dense lines is not a known OPC result (dense line/space needs little 2D correction); the "rivers" are ours
    fix: "sem_field(): straight lines with hammerheads at the ends, serifs at corners, a few jogs and separate assist bars (S9); keep 示意"
  - item: scale bar 200 nm (implies a 120 nm mask pitch / 46 nm lines)
    status: unsourced
    fix: tie it to a sourced pitch (104 nm on the mask = 26 nm on the wafer, NXE 13 nm x 4, S1) and label 掩模上（4×）, or drop the bar

