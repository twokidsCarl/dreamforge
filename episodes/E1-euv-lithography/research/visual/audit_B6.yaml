# Visual fact audit, segment B6 (the reflective mask and its pellicle). One row per engineering / structural / optical
# detail the PICTURE, the narration or the on-screen text shows. Checked 2026-10-21.
# status: sourced | wrong | unsourced | simplified | artistic   (see docs/WORKFLOW.md 2.3)
# Quotes: research/visual/B6B7_sources.md. Sources:
#   S1  ASML, EUV lithography systems page            https://www.asml.com/en/products/euv-lithography-systems
#   S2  ASML, "Indistinguishable from magic: the EUV pellicle" (Brunton, 14 Sep 2022)
#       https://www.asml.com/en/news/stories/2022/the-euv-pellicle-indistinguishable-from-magic
#   S3  ASML, Wilton CT location page                 https://www.asml.com/en/company/about-asml/locations/wilton-ct
#   S4  ASML, Computational lithography page          https://www.asml.com/en/products/computational-lithography
#   S5  Brouns (ASML), "Development and performance of EUV pellicles", Adv. Opt. Techn. 6 (2017) 221-227
#       https://www.frontiersin.org/articles/10.1515/aot-2017-0023/pdf
#   S6  van de Kerkhof et al. (ASML), EUVL Workshop 2019, slides 3/7  https://www.euvlitho.com/2019/P23.pdf
#   S7  Philipsen et al. (imec), "EUV masks: prospects and challenges", EUVL Workshop 2021  https://euvlitho.com/2021/P11.pdf
#   S8  AGC patent US 8,288,062 B2 (mask blank: 152 mm x 0.25 in; Mo 2.3 nm / Si 4.5 nm; 30-60 pairs)
#       https://patents.google.com/patent/US8288062B2/en
#   S9  Brion/ASML patent US 7,694,267 B1 (line-end pull-back; hammerheads, serifs)  https://patents.google.com/patent/US7694267B1/en
#   S10 ZEISS, Kaumanns et al., EUVL Workshop 2024, slide 9 (6 deg vs 5.4 deg)  https://euvlitho.com/2024/P22.pdf
#   S11 ASML, van Schoot, EUVL Workshop 2021, slides 34-36  https://www.euvlitho.com/2021/P3.pdf
#   S12 ASML, van Schoot, EUVL Workshop 2022, slides 12/14/34/39  https://euvlitho.com/2022/P3.pdf
#   S13 ZEISS, Heil et al., EUVL Symposium 2015, slides 9/11/21/24
#       https://euvlsymposium.lbl.gov/pdf/2015/Oral_Wednesday/Session9_EUV%20Lithography%20Extendibility/S9.2_Heil.pdf
#   S14 ZEISS, Conradi et al., EUVL Symposium 2011, slide 20 (NXE CRAO 6 deg)
#       https://euvlsymposium.lbl.gov/pdf/2011/pres/Olaf%20Conradi.pdf
#   D   derived physics, worked in B6B7_sources.md section D
# Previews reviewed as 3x3 contact sheets in renders/review/refs/B6B7/sheets/. Every B6 preview is dated 10-17. The
# mograph previews predate screen_text() (10-21 16:05), so the fact IDs they show are already stripped in code.
# B6_17 predates the High-NA re-layout of build_machine.py (10-19, 10-21).
# Machine rule: the film's scanner is the High-NA EXE:5000. B6 talks about the mask in general, but any NXE-only number
# (6 deg, 4x) must be labelled NXE.

B6_01:
  - item: chapter card 章节 · 掩模：芯片的底片
    status: artistic
    note: ASML calls the mask the "blueprint of the desired end result" (S4)
  - item: mask plate 3.0 x 3.0 units, thickness 0.042 of the side (6-inch reticle, 152 mm square, 6.35 mm thick)
    status: sourced
    source: S8 ("6 inches (152 mm) square", "0.25 inches (6.3 mm) thick"); S13 slide 21 ("6'' mask"); S11 slide 34 (reticle blank unchanged vs NXE)
  - item: pattern area a square 0.8 of the plate (122 x 122 mm)
    status: wrong
    source: S11 slide 34 ("Image field size at reticle level (104 x 132 mm)")
    fix: "b6_scenes._mask(): make the pattern plane a rectangle size*0.684 x size*0.868 (104 x 132 mm), long side along the scan direction. The same _mask() feeds B6_08, B6_12, B6_13 and B6_14."
  - item: smooth rainbow bands sweeping across the pattern (mask_material thin_film 250-1100 nm mapped along X)
    status: wrong
    source: "D (the Mo/Si period of 6.8 nm (S8) and the few-nm Ru cap give no visible thin-film colour; dense mask pitches of 104-160 nm are below the ~200 nm needed for a visible diffraction order); WORKFLOW s.9 lesson (芯片表面整片是平滑的彩虹渐变)"
    note: the storyboard text asks for 彩虹般的衍射色带 too. Real reticles can show colour only from um-scale periodic blocks.
    fix: "drop the Thin Film Thickness map in b6_scenes.mask_material(). Either keep a neutral metallic-grey multilayer with dark absorber, or build block-wise gratings (um periods, each block its own pitch and orientation, colour from the grating equation) as done for the chip. Edit the storyboard visual (p2_B2-B6.yaml B6_01) to 局部区块的衍射色."
  - item: dark holder, four pins, cradle
    status: artistic

