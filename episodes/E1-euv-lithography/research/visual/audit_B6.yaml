    status: simplified
    source: S1, S7
    note: the pattern is etched into the absorber. The openings reflect and the remaining absorber is the dark part. Saying "pattern reflects, absorber blocks" treats pattern and absorber as different things.
    fix: optional re-voice 吸收层上刻出图形：开口处反射光，留下吸收层的地方把光“关掉”。 Otherwise make the overlay say 开口 = 反射 · 吸收层 = 关
  - item: rays tilted 6 deg from the normal
    status: sourced
    source: S14 slide 20 ("CRAO = 6°", NXE); S10 slide 9
    note: correct for NXE; the film's EXE uses 5.4 deg (B7_11 makes that point)
  - item: reflection drawn at the top surface
    status: simplified
    note: real reflection is an interference sum from the whole Mo/Si stack (S1 "use interference"); fine for an energy diagram
  - item: overlay 反射 = 亮 · 吸收 = 关
    status: sourced
    source: S1, S7
  - glitch: in the energy style the absorber blocks render as faint outlines (frames 63-126), so half the beams seem to stop in mid-air. Give the absorber a visible energy silhouette or a dim fill.

B6_04:
