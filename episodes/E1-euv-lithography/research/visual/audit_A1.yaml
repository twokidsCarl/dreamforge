A1_01:
  - item: chapter card over a defocused rainbow sheen on a wafer edge
    status: artistic
    source: chips.md C (patterned wafers show diffraction colours from coarse periodic structures)
    note: mood only; nothing a viewer would read as a measurement
  - item: NEW - the sheen is a 60-line arc band that ends in a hard straight radial cut inside the frame (upper right)
      once the blur drops, and the separate arc lines show as fine ringing/moire at the end of the shot
    status: glitch
    verified: "2026-10-22: sample 0040-0084 - straight cut-off edge at the band's 280 deg end, clearly visible upper right
      from 0060; 0076-0084 the individual arc lines read as moire rings. It reads as a cut rainbow ribbon, not a wafer edge."
    fix: extend the arc span so both ends lie outside the frame (e.g. 180-300 deg with the centre moved) or fade the ends
      with an angular alpha ramp; keep the final blur >= 4 px (1080p) so the 60 discrete arcs merge into a smooth sheen.
A1_02:
  - item: wafer = substrate with thin films built on top, one layer at a time (cut-away shows substrate plus three film layers)
    status: sourced
    source: S3 (ASML Annual Report 2021 - "layers about 50 to 150 nm thick that are built on the semiconductor substrate one layer at a time")
    verified: "2026-10-22: claim stands, but see the new glitch below - in the sample the section faces show no layers."
  - item: proportions - drawn diameter/thickness about 8.5:1 (r 2.0, total thickness 0.47); films 1/5-1/8 of the substrate thickness
    status: simplified
    note: real 300 mm wafer is 775 um thick (S13), diameter/thickness about 390:1; films are 50-150 nm (S3), about 1/10,000 of the substrate.
      Necessary for a readable section; no number is shown.
    fix: none needed for the shot; do not add a dimension label. If a caption is added later use 示意（未按比例）
  - item: NEW - the wedge's cut faces render as one uniform grey slab; substrate and the three films cannot be told apart
      on the section (the shot's whole point). The layers only show as grooves on the outer rim
    status: glitch
    verified: "2026-10-22: sample 0090, 0120, 0145 (zoomed crop of 0145) - both cut faces a single flat tone, no boundary
      lines; the four L0-L3 greys (0.62/0.78/0.70/0.85) are flattened by the clay look."
    fix: give each layer a distinct clay value that survives the clay style (or tag films so the style keeps their colour),
      and add a thin dark seam at each boundary (small bevel / inset of 0.005 per film) so the section reads as substrate
      + 3 films; keep 示意-free since nothing is measured.
