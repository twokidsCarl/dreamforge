    verified: "2026-10-22: a1_scenes.spin keys 60 deg by frame 60 (dispense), ramps to 750 deg/frame (=3000 rpm at
      24 fps) from frame 90 to 174, motion blur on. Sample 0060 notch sharp (slow phase); 0092-0130 notch blurred out,
