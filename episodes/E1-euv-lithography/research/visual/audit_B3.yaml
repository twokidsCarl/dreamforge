# Visual fact audit, segment B3 (collector -> intermediate focus). One row per engineering / structural / optical detail
# the PICTURE or on-screen text shows (narration numbers live in research/facts.yaml). status:
#   sourced    - matches a primary source cited here
#   wrong      - contradicts a source; must change
#   unsourced  - invented or unchecked; may not reach the final render
#   simplified - deliberate simplification; difference stated
#   artistic   - deliberate convention, flagged on screen as 示意 where a viewer could take it literally
#   glitch     - rendering / readability problem still open; fixed - glitch seen resolved by the verification pass
# Sources S1-S11 and the recomputed geometry: research/visual/B3_sources.md. Background: euv_source.md s.4-6.
