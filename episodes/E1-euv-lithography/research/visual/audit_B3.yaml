  - item: ellipse proportions - eccentricity 0.83, F1-vertex to F1-F2 = 1 to 9.5; the 3D shots (B3_02/05/06) use 0.64 and 1 to 3.5, and the storyboard asks B3_03 to match B3_02's outline
    status: unsourced
    note: real distances are not public (euv_source.md not-public 1-2; S7, S8 give none)
    fix: use the build_source ellipse (a=11, c=7, scaled to the frame) and add a 示意 tag to the frame
  - item: mirror arc drawn continuous through the vertex (no laser hole)
    status: wrong
    source: S3 p.176, S6, S7 (central aperture for the laser)
    fix: leave a gap around the vertex (hole/rim diameter ratio 0.11 as in 3D, i.e. ±10 deg seen from F1)
  - item: layout - "收集镜的镜面" label sits at the top-left corner, away from the arc
    status: simplified
    fix: place the label next to the arc
