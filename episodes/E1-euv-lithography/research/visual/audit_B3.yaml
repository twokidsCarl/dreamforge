# Visual fact audit, segment B3 (collector -> intermediate focus). One row per engineering / structural / optical detail
# the PICTURE or on-screen text shows (narration numbers live in research/facts.yaml). status:
#   sourced    - matches a primary source cited here
#   wrong      - contradicts a source; must change
#   unsourced  - invented or unchecked; may not reach the final render
#   simplified - deliberate simplification; difference stated
#   artistic   - deliberate convention, flagged on screen as 示意 where a viewer could take it literally
# Sources S1-S11 and the recomputed geometry: research/visual/B3_sources.md. Background: euv_source.md s.4-6.
# Checked against: storyboard/parts/p2_B2-B6.yaml, mograph/b3.py, blender/scripts/build_source.py,
# blender/shots/b3_scenes.py + b1_source.py (CamB3_02), build_vacuum.source_vessel, shared/blender/materials.py,
# shared/tools/edit_film.py (how overlays reach the screen), previews renders/shots/B3_*/preview (2026-10-16/17).
B3_01:
  - item: EUV leaves the plasma point in every direction (spherical burst of rays)
    status: sourced
    source: S3 p.181 "open access to the EUV emission pattern over the full 4π sr"
  - item: rays violet, drawn as moving streaks, slow motion
    status: artistic
    note: 13.5 nm EUV is invisible (euv_source.md s.4); project convention EUV = violet
  - item: chapter card "章节 · 收集镜：把爆炸的光收回来"
    status: simplified
    note: edit_film.py label_for() and story_reel drop overlays with kind chapter, so the card is never drawn by the edit. Wording itself is fine.
    fix: confirm where chapter cards are rendered; if nowhere, add them to the edit
  - item: rendering glitch - frames 1-10 have a grey vignette instead of the black ground the storyboard asks for; frames ~15-30 wash out to a flat lavender field (420 rays at bevel radius 0.006 fill the frame while the camera sits 2 units from the core, plus bloom)
    status: simplified
    fix: start CamB3_01 further out or ramp ray emission/bloom over the first second; keep world black
B3_02:
  - item: concave ellipsoidal normal-incidence multilayer collector, laser hole at its centre, plasma site in front of the centre
    status: sourced
    source: S1 ("Ellipsoidal design • Plasma at first focus"), S3 p.176 ("central aperture in the collector"), S6, S7
  - item: rim just behind the droplet path (rim 93.2 deg from the axis seen from the plasma; 5.84 sr collected; incidence angle 3.9-31.5 deg)
    status: sourced
    source: S2 ">5sr 650mm diameter normal incidence collector"; S3 p.181 "5.5 sr", AOI kept below ~45 deg; S6 mirror extends "almost to the focus point" so it does not block the droplets
  - item: collector size against droplet and pre-pulse sheet (collector 12.6 units = 1.6 mm at the droplet scale, real 650 mm; the 300 um sheet looks larger than the laser hole)
    status: simplified
    source: S2 (650 mm); audit_backlog.yaml B1 note
    note: on-screen label "椭球形收集镜（示意，非比例）" is drawn (3D shot, first overlay) - keep it
  - item: central hole diameter = 0.11 of the collector diameter
    status: simplified
    note: not public; S1 photo reads ~1/6 (our reading). Covered by the 示意 label.
  - item: coating look - dark steel-blue mirror; material has thin-film rainbow bands (barely visible); storyboard text promises 蓝紫—金色 interference colours from hole to rim
    status: artistic
    source: S1 photo shows a mirror-bright bowl with a warm gold/amber cast and no rainbow bands; S1/S8 graded Mo/Si coating (thickness follows the local angle of incidence)
    note: materials.multilayer_mirror docstring already says the rainbow is an artistic cue
    fix: drop the rainbow wording from the storyboard; warm amber metallic tint and brighter environment reflections to match the S1 photo
  - item: tin droplets crossing in front of the collector, perpendicular to its axis
    status: sourced
    source: S2 (horizontal droplets, x across z), S5; euv_source.md s.1
  - item: pre-pulse beam emerging from the central hole along the axis
    status: sourced
    source: S3 p.176; S2 drawing
    note: orange colour is artistic (CO2 10.6 um is infrared and invisible)
  - item: dark ring housing at the rim, ribbed chamber, round ports behind
    status: simplified
    note: real collector sits in a cylindrical housing about one diameter deep (FOM17 Fig. 16, euv_source.md s.5); interior not public
  - item: collector axis horizontal
    status: simplified
    source: S2 "62 degree orientation", S5 IF at the top of the vessel
    note: cannot be read in this shot; matters in B3_06
  - item: rendering - the last ~20 frames show the pre-pulse sheet as a large lumpy silver blob beside the hole, which reads as debris stuck on the mirror and pulls attention from "巨大的收集镜"
    status: simplified
    fix: end the shot before the sheet forms, or keep the droplets only
