B4_01:
  - item: a plain silvered mirror swallows the EUV beam; narration 普通镜子，几乎反射不了极紫外光; overlay 普通镜子 · 几乎不反射（示意）
    status: sourced
    source: "S12 CXRO at 13.5 nm: Ag 0.51 % at normal incidence, 0.56 % at the 27 deg incidence coded here; Al 0.022 %; glass (SiO2) 0.015 %. A household mirror is back-silvered, so the EUV is absorbed in the front glass within ~0.1 um (A3 S5) and never reaches the silver."
  - item: angle of incidence (code - beam from (12,6,0) to the mirror centre, 27 deg from the normal; storyboard camera note 镜面与入射光成小角度)
    status: sourced
    source: S12 (Ru reflects 94 % at 5 deg grazing - metals DO reflect EUV at grazing incidence)
    note: the code is near-normal and therefore right; the storyboard note, read as grazing incidence, would contradict the narration
    fix: storyboard p2_B2-B6.yaml B4_01 camera.notes → 光束接近垂直入射（与镜面法线约 25°），反射方向留空
  - item: warm glow ring around the mirror rim (Heat torus, major radius 2.02, at the frame edge)
    status: wrong
    source: A3 S5 (SiO2 attenuation length 0.0997 um at 13.5 nm) - the absorbed energy is deposited where the beam lands, in the top ~0.1 um
    note: nothing heats the rim first; the storyboard text 镜框边缘只微微泛起一圈暗橙色的热 is the same mistake
    fix: b4_scenes.silver() - replace the Heat torus with a small emissive disc (radius ~0.15) on the mirror face at the impact point (0.08, 0, 0), fading in from frame 24; edit the storyboard visual to 光斑处微微泛起暗橙色的热
  - item: beam colour
    status: artistic
    glitch: emission strength 10 with bloom renders the beam white with a lavender halo, not the film's EUV violet (preview frames 13-100); lower to ~3-4 or saturate VIOLET
  - glitch: the MirrorEdge torus shows gaps (top and lower left, frames 1-25) - it intersects the mirror body; offset it in front of the face or make it a curve

B4_02:
  - item: zoom into the mirror face, grey cross-section with dark Mo and light Si layers under a cap (b2_scenes.multilayer)
    status: sourced
    source: S1 (Mo and Si layers vapor-deposited on the glass surface); S10 slide 23 (Mo/Si Bragg sketch on a substrate and a dark/light banded cross-section micrograph); S14 and S11 p.750 (Ru cap on top)
    note: dark Mo / light Si is the TEM bright-field look (S10 s.23 inset); in an SEM back-scatter image Mo would be the brighter layer, so never caption the picture "SEM"
  - item: narration 最多约 100 层 and overlay 钼 / 硅 交替 · 最多约 100 层 · 每层几 nm
    status: wrong
    source: S2 (High-NA mirrors "consisting of more than a hundred layers"); S10 s.23 (Starlith 3400 "> 50 Bi Layers"); S1 says "up to 100 layers" but is the older 0.33 NA page
    note: 最多 (at most) is contradicted by ZEISS's own High-NA and Starlith 3400 statements; the film's machine is High-NA
    fix: overlay → 钼 / 硅 交替 · 上百层 · 每层几 nm; narration in script_zh.md and p2_B2-B6.yaml → 蔡司的办法，是在镜面上交替镀钼和硅，多达上百层，每层只有几纳米厚。 then tts / vo_align / retime / asr_check; add S2 and S10 s.23 to F8
  - item: Mo and Si layers equally thick (t = 0.11 each)
    status: wrong
    source: S13 Table 3 (Mo 2.14 nm, Si 3.72 nm, interlayers 0.80 / 0.41 nm, period ~7.07 nm); S10 s.23 sketch (Mo thinner than Si); A3 S6 (CXRO design Gamma = 0.4 - Mo 2.8 nm, Si 4.1 nm of 6.9 nm)
    note: answers the open item in audit_B2.yaml B2_05
    fix: b2_scenes.multilayer() - Mo layer thickness 0.8*t, Si 1.2*t (Gamma 0.4); the same change fixes B2_05 and B2_08
  - item: 40 layers drawn (n_pairs=20); storyboard counter rolls to 约 100
    status: simplified
    note: the counter is a post overlay (not in b4_scenes) and is missing from the preview; it must end at 100+ to match the corrected text
  - item: layer thickness 每层几 nm
    status: sourced
    source: S1 ("The layer thicknesses are only a few nanometers thin"); S13
  - glitch: the 10-17 preview is a static crop of horizontal stripes - no zoom-through from the mirror face, no scan line, no counter, and it predates the capping layer added to b2_scenes.multilayer on 10-21; re-render

B4_03:
  - item: text 单层 ≈ 1% / 叠加后 最高约 70%; caption 每层反射的弱光波步调一致、同相叠加（示意）
    status: sourced
    source: S1 ("A single layer would only reflect a good one percent of the light"; "up to 70 percent"; "constructive interference ... the individual radiation waves are perfectly superimposed"); S11 p.749
  - item: angle of incidence about 62 deg from the normal (incoming rays 28 deg above the layers)
    status: wrong
    source: S10 s.23 (ZEISS Bragg sketch - incident ray a few degrees from the normal); HNO §1.5 (chief-ray angle at the mask 5.4 deg); A3 S6 (a 6.9 nm Mo/Si stack reflects ~1 % already at 25 deg incidence)
    note: an imaging Mo/Si mirror for 13.5 nm does not reflect at 62 deg; the picture teaches the wrong geometry
    fix: mograph/b4.py bragg() - incident beam at most ~10 deg from the normal, drawn as in S10 s.23
  - item: reflected wavelets leave at 62 deg above the layers while the incident beam arrives at 28 deg below; the summed beam is drawn at ~30 deg
    status: wrong
    note: breaks the law of reflection, and the wavelets do not point the same way as the beam they are supposed to add up to
    fix: every wavelet and the summed beam parallel, mirror-symmetric to the incident beam about the normal
  - item: incoming rays fan out from one point (x0, y0) and bend sharply at the top surface (28 deg → 62 deg below the horizontal)
    status: wrong
    source: S10 s.23 (incident ray drawn straight through the stack, parallel reflected rays); CXRO index of Mo and Si at 13.5 nm differs from 1 by only a few per cent (A3 S5/S6 database)
    fix: a plane wave - parallel incident rays (or wavefront lines) straight through the stack; draw crests on the wavelets so that 步调一致 / 同相 is visible
  - item: 14 interfaces
    status: simplified
    note: real stacks have >50 bilayers (S10 s.23, S11 p.749); fine for a diagram
  - glitch: the summed beam starts at y = 300, above the top interface (y = 330), so it floats free of the stack and runs off the top edge; stale "（示意，F8）" in the 10-16 preview

