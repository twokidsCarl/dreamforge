  - item: 示意 overlay
    status: sourced
    note: present, keep

B2_08:   # b2_scenes variant clean, sem
  - item: overlay Sn + 4 H· → SnH₄↑（气体）
    status: sourced
    source: S1 slide 34 ("Sn (s) + 4H (g) → SnH4 (g)"); S2 p.183 eq. (1), "it can be pumped away as it is gas under the source conditions"
  - item: overlay H₂ → 2 H·
    status: sourced
    source: S2 p.183 eq. (2)
  - item: radicals made by EUV (VO 极紫外光又把氢分子打碎)
    status: simplified
    source: S2 p.183 ("thermal dissociation in the plasma region, photo-dissociation by plasma radiation, dissociation by photo-electrons"); S4 slide 15
    note: EUV/plasma radiation is one of three routes; acceptable for narration
  - item: H atoms arrive already split from above; no H2 molecules and no EUV flash (storyboard asked for both)
    status: simplified
    fix: start with H2 dumbbells above the surface, a violet flash, then the pairs fly apart into single radicals
  - item: four H attach at once to make a tetrahedral SnH4
    status: simplified
    note: tetrahedral geometry is correct for stannane; real hydrogenation is stepwise (SnH, SnH2 ...)
  - item: every SnH4 leaves and the surface ends clean
    status: simplified
    source: S2 p.183 (photo-dissociation of stannane and catalytic dissociation on Sn-covered surfaces "tend to bring Sn back to collector surfaces"; K_net = K_SnH4(1 - K_redep))
    fix: optional - one molecule breaks up and drops its Sn back
  - item: dedicated in-situ hydrogen-radical sources for collector cleaning not shown
    status: simplified
    source: S2 p.182 ("A tin cleaning technique using hydrogen radicals was developed"); S12 (ASML patent US11013096B2, RF/inductive radical sources in the vessel)
  - item: bare Mo top layer (atom scale is simplified, see B2_05)
    status: wrong
    note: same as B2_05 - add a capping layer (wrong); atom scale is simplified (label it)
  - item: SEM look resolving atoms and molecules
    status: artistic
    note: 示意 on screen

