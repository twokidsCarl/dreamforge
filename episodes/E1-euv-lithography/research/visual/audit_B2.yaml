B2_04:   # b2_scenes variant ions, energy
  - item: ion tracks radiate from the plasma and strike the collector
    status: sourced
    source: S2 p.176, p.182 ("high-energy ions and neutrals from the plasma could strike the collector surface"); S1 slide 23
  - item: overlay 锡离子 Sn¹⁺–Sn⁸⁺
    status: sourced
    source: S7 (Poirier et al. 2022, Appl. Phys. B - "Typically the Sn ions coming from the plasma are in charge states of 1+ to 8+")
    note: ARCNL lab plasma (Nd:YAG); the charge distribution of ASML's CO2-driven source is not public (F26 note)
  - item: overlay 能量可达数 keV
    status: sourced
    source: S2 p.180 ("accelerates ions ... up to several keV"), Fig. 18 (ion energies at the collector position up to ~3.5 keV without H2); S7 ("energies ranging up to several keV")
  - item: colour/width by charge state - 1+ brightest and thickest, 8+ dimmest and thinnest
    status: artistic
    source: S7 ("For ions with the same energy-over-charge ratio, the higher charged ions have higher energy")
    note: if a viewer reads brightness as energy, the encoding is backwards; no legend is shown
    fix: uniform colour, or make higher charge states brighter (more energetic)
  - item: a spark at every 4th impact on the mirror
    status: artistic
    note: ion impacts deposit/implant/sputter atoms; there is no source for visible sparks
    fix: optional - tiny grey sputter puffs instead of white sparks
  - item: all 520 tracks are drawn by frame ~45 and then stay as a static starburst for ~4.5 s
    status: glitch
    fix: animate each ion as a moving head with a fading tail, emitted continuously, so the 'rain' keeps falling while the VO runs
  - item: collector shown only as a faint dark-blue outline, barely visible
    status: glitch
    fix: brighter metrology-cyan rim as the storyboard says
  - item: number of tracks
    status: artistic

