# Visual fact audit, segment B2 (vacuum, hydrogen and debris). One row per engineering / structural / physics
# detail the PICTURE or on-screen text shows (narration numbers live in research/facts.yaml). status:
#   sourced    - matches a primary source cited here
#   wrong      - contradicts a source; must change
#   unsourced  - invented or unchecked; may not reach the final render
#   simplified - deliberate simplification; the difference from reality is stated
#   artistic   - deliberate convention (slow motion, violet EUV...); flag 示意 where a viewer could take it literally
#   glitch     - rendering / readability problem still open (not a fact status)
#   fixed      - a glitch that the verification pass saw resolved in current frames
# Sources: S-numbers in research/visual/B2_sources.md (local copies in renders/review/refs/B2/ and refs/source/).
# Checked 2026-10-21 against code (b2_scenes.py, b1_source.py, build_vacuum.py, mograph/b2.py), storyboard
