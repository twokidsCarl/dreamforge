# (960x540, rendered 01:15-08:10, all after the last code change for their shot, frame counts = timed durations),
# except B2_01: only frames 1, 50 and 95 were re-rendered (10:23) with the commit a393fa0 camera; the other 94 frames
# are the old framing - STALE, re-render in progress. Labels / chapter cards checked by running edit_film.labels_for,
# draw_label and draw_chapter on sample frames (no edited B segment exists yet).

