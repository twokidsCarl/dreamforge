# Visual fact audit, segment B2 (vacuum, hydrogen and debris). One row per engineering / structural / physics
# detail the PICTURE or on-screen text shows (narration numbers live in research/facts.yaml). status:
#   sourced    - matches a primary source cited here
#   wrong      - contradicts a source; must change
#   unsourced  - invented or unchecked; may not reach the final render
#   simplified - deliberate simplification; the difference from reality is stated
#   artistic   - deliberate convention (slow motion, violet EUV...); flag 示意 where a viewer could take it literally
#   glitch     - rendering / readability problem (not a fact status; listed so it is fixed in the same pass)
# Sources: S-numbers in research/visual/B2_sources.md (local copies in renders/review/refs/B2/ and refs/source/).
# Checked 2026-10-21 against code (b2_scenes.py, b1_source.py, build_vacuum.py, mograph/b2.py), storyboard
# parts/p2_B2-B6.yaml and preview frames renders/shots/B2_*/preview (640x360).
# NOTE: B2_11 uses build_machine (now the High-NA EXE:5000 model) and must be re-framed (audit_backlog ALL).

B2_01:   # b1_source sim, CamB2_01, photoreal
  - item: collector face in the dark vessel just after the main pulse
    status: simplified
    source: S1 slide 35 (photo of a real collector - mirror-bright bowl with a gold cast); euv_source.md s.5
    note: in the render the face is a flat lavender wash lit by the plasma glow; the collector look itself is a B1 item
  - item: glowing tin embers drifting slowly toward the collector
    status: simplified
    source: S1 slide 23 (cartoon - tin ions fly back toward the laser side, i.e. toward the collector; '"ejecta" microparticles, tin vapor' leave the far side); S2 p.182 ("high-energy ions and neutrals from the plasma could strike the collector"), p.183 (microparticles reach the collector as secondary debris after hitting walls)
    note: primary microparticles go mostly away from the collector; what hits the mirror directly is ions and neutral vapour, which do not glow as sparks
    fix: let most embers fly away from the mirror (toward the far side / catcher) and leave the 'threat to the mirror' to the ion tracks in B2_04; or keep a few embers but do not aim them at the mirror
  - item: violet EUV cone from the mirror toward the IF (storyboard)
    status: glitch
    note: not visible in any preview frame
    fix: make sure the euv_cone is in frame and lit, or drop it from the storyboard text
  - item: last ~1.4 s (frames ~70-103) are an almost featureless lavender field (out-of-focus collector face fills the frame)
    status: glitch
    fix: end the push-in on the collector rim / hole so the frame keeps a readable structure
  - item: chamber wall, ribs, ports, status LEDs
    status: artistic
    source: build_vacuum.py docstring; euv_source.md 'NOT public' (vessel internals are not published)

