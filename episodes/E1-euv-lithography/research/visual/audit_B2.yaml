B2_11:   # b2_scenes variant glow (build_machine = High-NA model) - RE-FRAME NEEDED
  - item: EUV ionises the ~5 Pa hydrogen into a weak plasma along the light path
    status: sourced
    source: S4 slide 15 ("In scanner, plasma is created by EUV photons ... EUV photons hit H2 molecules; primary electrons create secondaries; low plasma density & temperature"); S8 p.1, p.3
  - item: glow colour violet
    status: artistic
    source: S4 slide 15 (ASML's own illustration of the scanner plasma is a violet glow along the beam)
    note: no photograph is public; ionisation is tiny (~1e15 m^-3 ions per pulse vs 1.2e21 m^-3 gas, S8 p.7-8), so the real glow would be very faint
  - item: one pulse lights the glow, which fades over ~5 s
    status: simplified
    source: S8 p.3 (pulses <100 ns every 20 us; phases 0-0.2 us photoionisation, 1-20 us diffusion and decay), p.6-7 ("decay times ... at 1-10 Pa will be longer than the pulse interval of 20 us and plasma will build up over several pulses")
    note: in reality it is a quasi-steady glow while the exposure runs, not a single slow flash
    fix: show it as a glow that builds up over a few rapid pulses and stays while the light is on; or mark 慢动作 · 示意
  - item: glow drawn as constant-radius (0.12) tubes along each leg of the path
    status: simplified
    source: S8 p.1 ("The EUV beam will vary in intensity and shape throughout the scanner, as will the plasma"), Table 1 (beam 11 x 1 cm at the reticle); S13 Fig. 4b ("plasma accumulation beyond the beam confines over multiple pulses")
    fix: let the glow follow the beam envelope (converging/diverging cones, slit-shaped at the reticle) with a soft halo outside it
  - item: machine interior, mirror positions and light path
    status: sourced
    source: high_na_optics.md (build_machine PATH)
    note: rebuilt as High-NA EXE:5000 - re-frame camera CamB2_11 (BM.CENTER) before final render

