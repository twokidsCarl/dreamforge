  - item: reflectivity needle sliding in the corner (storyboard)
    status: glitch
    note: not built; only the 反射率 ↓ overlay exists

B2_06:   # b2_scenes variant ions_h2, energy
  - item: hydrogen buffer gas slows the ions before the mirror (overlay H₂ 缓冲层)
    status: sourced
    source: S1 slide 34 ("Hydrogen buffer gas (pressure ~100Pa) causes deceleration of ions"); S2 p.182 and Fig. 18
  - item: ion tracks kink through large random angles at each leg (gauss 0.5 per leg)
    status: wrong
    source: S9 (two-body elastic kinematics - a projectile heavier than its target is deflected by at most arcsin(m_target/m_projectile)); Sn 118.7 u on H2 2 u -> max ~1.0 deg per collision
    fix: tracks stay nearly straight while they dim and shorten (losing energy); only the last, thermalised part may wander slowly with the gas flow
  - item: some ions still reach the mirror region / tracks die at 35-82 % of the way
    status: simplified
    source: S2 Fig. 18 (higher H2 pressure cuts ion flux and energy at the collector by orders of magnitude; not to zero)
  - item: H2 molecules static, spread uniformly around the plasma
    status: simplified
    source: S1 slide 34 ("Hydrogen flow away from collector reduces atomic tin deposition rate"; flow lines start on the collector surface); S2 p.183 ("fresh gas has to be flown constantly into the vessel at high flow rates")
    fix: drift the H2 dots away from the mirror surface (slow streaks), which also explains why tin is pushed back
  - item: tracks shift from white to dark orange as they slow
    status: artistic
    note: consistent with S7 (H2 lowers charge states by electron capture), but colour is a convention
  - item: same static-starburst problem as B2_04 after frame ~40
    status: glitch
    fix: as B2_04
  - item: number and size of H2 'dumbbells'
    status: artistic
    note: optional overlay addition 约 100 Pa (S1 slide 34) would keep it distinct from the scanner's 5 Pa in B2_10

