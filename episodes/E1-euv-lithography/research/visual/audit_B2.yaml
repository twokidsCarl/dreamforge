    status: simplified
    source: S6 (Poirier et al. 2022, "strongly anisotropic ion emission" from Sn microdroplet plasma); S1 slide 23 (ions back toward the laser, ejecta forward)
    note: emission is not uniform; ions peak back toward the laser/collector side, microparticles forward
    fix: 'bias the spark burst - fewer sparks toward the mirror, more toward the far side - or accept as simplified (VO 四面八方 is loose but not false: ions are detected at all measured angles)'
