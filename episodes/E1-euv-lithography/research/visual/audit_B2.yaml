    note: real attenuation length ~0.14 mm, so the drawn length is hugely exaggerated; covered by the 示意 overlay
  - item: air molecules as dots in the tube
    status: artistic
  - item: overlay λ = 13.5 nm
    status: sourced
    source: F1 (ASML light-and-lasers page)
  - item: overlay 空气会吞掉 EUV → 整条光路：真空
    status: sourced
    source: S3 ("the whole light path ... from source to wafer – must be in high vacuum"); refinement to ~5 Pa H2 comes in B2_10 (S4)
  - item: source vessel = horizontal drum narrowing into a cone toward the IF
    status: simplified
    source: S5 panel 1 (schematic - cone lined with "Vanes" narrowing to the "Intermediate Focus Unit"); S1 slide 28 (real vessel - bowl around the collector, IF on top); S5 ("62 degree orientation")
    note: real vessel is tilted (IF up) and has vanes and an obscuration on the plasma-IF line; neither shown. 示意 overlay is present
  - item: storyboard says collector, EUV path and wall-mounted pumps appear after the scan-wipe; the 'air' variant builds only the empty vessel
    status: glitch
    note: end frames show an empty ghost vessel under the label 整条光路：真空 - no light path to point at
    fix: in b2_scenes.air() add S.collector(), S.euv_cone()/intermediate_focus() and the pumps (as in pumps()), framed as B2_09's opening
  - item: EUV beam in the air tube renders near-white in xray instead of violet
    status: glitch
    fix: keep the violet EUV colour code in xray (exclude the beam from the xray restyle)

