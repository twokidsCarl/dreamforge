# EUV film fact base. Every number on screen or in narration must map to an entry here.
#
# status:  verified   - may be used as stated
#          disputed   - use only the wording in `narration`
#          reported   - grade C; narration must carry「据报道」or name the outlet
#          derived    - our own arithmetic from verified inputs; show the inputs
#          rejected   - must not be used
# grade:   A = ASML / ZEISS / TRUMPF official; B = peer-reviewed, conference, patent, customer
#          first-party; C = media
# Checked 2026-10-16 unless noted. Supersedes docs/FACTS.md (kept for history).

F1:
  claim: EUV 波长 13.5 nm，比 DUV 的 193 nm 短 14 倍以上
  values: {euv_nm: 13.5, duv_nm: 193}
  status: verified
  grade: A
  sources:
    - https://www.asml.com/en/technology/lithography-principles/light-and-lasers
  segments: [A2, B1]

F2:
  claim: 最新商用光源每秒 6 万次（锡滴）；早年的说法是 5 万次
  values: {droplets_per_s: 60000}
  status: verified
  grade: A
  quote: "this process is repeated thousands of times per second – 60,000 times per second in our latest commercial sources."
  sources:
    - https://www.asml.com/en/investors/annual-report/2025
    - https://www.asml.com/en/products/euv-lithography-systems
  notes: >-
    ASML 2025 年报故事栏目原文如上（research/visual/B1_sources.md）。旧页面写 50,000；以最新的 6 万为准，不说“最多”。
    锡滴间距：70 m/s ÷ 6 万/秒 ≈ 1.2 mm（推算，F3）；50 kHz 时 ASML/Cymer 给出 "1.5-mm droplet-to-droplet spacing"
    （Fomenkov et al. 2017 p.180, https://www.degruyterbrill.com/document/doi/10.1515/aot-2017-0029/pdf）。画面写“约 1–1.5 mm”。
  segments: [B1, C, D]

