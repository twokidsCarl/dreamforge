F4c:
  claim: 光源功率：NXE:3800E 的光源超过 500 W；2025 年 4 月 ASML 演示了第一台 1000 W 的 EUV 光源
  values: {nxe3800e_w: 500, demo_w: 1000}
  status: verified
  grade: A
  quote: >-
    "In April 2025, ASML reached a historic milestone: demonstrating the first ever 1,000-watt light source for EUV
    lithography." (ASML Annual Report 2025, p.31); "an increase in EUV source power (to >500W)" for NXE:3800E
    (Hummler et al., ASML, Proc. SPIE 12953, 2024)
  sources:
    - https://www.asml.com/en/investors/annual-report/2025
    - https://doi.org/10.1117/12.3010463
  notes: 1000 W 为 A 级；>500 W 为 B 级（ASML 作者的 SPIE 论文）。“量产 600 W”“原理样机/实验室”只见媒体，不用。
  segments: [B1, D]

F5:
  claim: 锡等离子体温度约 50 万开尔文
  values: {temperature_k: 500000}
  status: verified
  grade: A
  quote: "A more powerful laser pulse – hotter than the surface of the sun at a temperature of about 500,000 K – vaporizes the tin pancakes."
  sources:
    - https://www.asml.com/en/discover/hot-machines
  notes: ASML 官网原文如上（措辞把温度挂在激光脉冲上，旁白说成等离子体的温度）。冲突：ZEISS 官网写“将近 22 万 ℃、约太阳表面 40 倍”；ASML 2025 年报故事栏目也写“40 times hotter than the surface of the sun”（≈23 万 K，research/visual/B1_sources.md）。论文测得电子温度约 30–40 eV（≈35–46 万 K）。ASML 自家 S2 光源实测电子温度 30–42 eV（Torretti et al. 2020），约 35–49 万 K，与 ASML 官网的 50 万 K 一致，“40 倍太阳表面”是通俗比喻、偏低；保留用户已拍板的 50 万 K。不要同时说两个数字。
  segments: [B1, C]

F6:
  claim: TRUMPF CO₂ 驱动激光：种子光几瓦 → 预放大到 100 W → 4 级谐振放大链到最高 40 kW（放大 1 万倍以上），峰值功率兆瓦级；光束最长传输约 30 m 进入锡滴腔；三套冷却回路
  values: {seed_w: few, preamp_w: 100, stages: 4, output_kw: 40, beam_path_m: 30}
  status: verified
  grade: A
  narration: 输出功率达几十千瓦（用户决定）；分级放大时可写“4 级”
