# Storyboard part 3: B7 投影物镜与 High-NA / B8 工件台 / B9 光子雨 / C 总装长镜头 / D 收束
# Source: script_zh.md v4, skeleton.yaml, facts.yaml (2026-10-16).
# Conventions
#   - vo: verbatim narration sentences (refs stripped); [] = purely visual beat.
#   - duration >= sum(chars/250*60 + 0.35) of its vo lines.
#   - Every on-screen number cites facts; grade-C / reported facts carry「据报道」on screen.
#   - 「示意」 tag on every machine-internal geometry that is not public (mirror layout, stage
#     mechanics, machine exterior). No replica of real ASML / ZEISS CAD or product exteriors.
#   - Accent colours: EUV-violet (EUV light, photons), laser-orange (CO2 drive laser, force,
#     danger), metrology-cyan (sensors, HUD, measurement), line-white (blueprint, labels).
#   - C_02..C_04 are ONE continuous camera take (TAKE C_LONG) split only for VO bookkeeping:
#     no cut between them; transition_in "push-through" marks the hand-over point.
# =====================================================================================
# B7 投影物镜与 High-NA：在镜子上开一个洞      target 110 s
# =====================================================================================
# =====================================================================================
# B8 工件台：比战斗机更猛，比原子更稳      target 120 s
# =====================================================================================
# =====================================================================================
# B9 光子雨：账本的最后一页      target 70 s
# =====================================================================================
# =====================================================================================
# C 总装：跟着一滴锡走完全程      target 100 s   (climax, TAKE C_LONG = C_02..C_04)
# =====================================================================================
# =====================================================================================
# D 收束：回到那一滴锡      target 55 s (VO alone 54.9 s)
# =====================================================================================
shots:
- id: B7_01
  segment: B7
  duration: 7.5
  vo:
  - 从掩模反射出的光，进入投影物镜——由六面反射镜组成。
  facts:
  - F7
  style: xray
  style_why: 观众第一次进入投影物镜内部，问题是“里面怎么排布”，幽灵玻璃外壳让六面镜和光路同时可见
  transition_in: dissolve
  visual: 承接 B6 的掩模：一束 EUV 紫光从掩模反射向下，镜头跟着光束钻进一只浅灰棚拍背景下的幽灵玻璃箱体。箱内六面镜（M1–M6）沿折线排布，光束每到一面，那面镜子的 Mo/Si 膜就亮起一圈虹彩，编号依次浮现。最终光束出箱、朝画面下方的晶圆收拢。
  camera:
    move: follow-dolly
    lens_mm: 35
    fstop: 5.6
    notes: 沿光路样条跟随，速度随光束；结尾升高到 3/4 俯视全景让六面镜同框
