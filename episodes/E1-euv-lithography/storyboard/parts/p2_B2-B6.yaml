# 《一台光刻机里发生了什么》分镜 · 第 2 部分：B2–B6（真空 → 收集镜 → 多层膜 → 照明 → 掩模）
# 2026-10-16。来源：script_zh.md 第四稿、skeleton.yaml、facts.yaml、计划 §1/1b/1c/4/7/8。
# 目标时长：B2 75 s · B3 45 s · B4 120 s · B5 55 s · B6 100 s ≈ 395 s；旁白约 273 s，其余为纯画面节拍。
#
# 约定
# - vo：脚本原句（去掉〔F..〕）；duration ≥ 字数/250×60 + 0.35 s/句。
# - 风格切换一律用非 cut 的 transition_in；同风格接续才用 cut。
# - 同一物体跨风格保持同一机位（scan-wipe / fade-to-energy / match-cut 的前后两帧构图一致）。
# - 强调色：EUV-violet（EUV 替身光）、laser-orange（驱动激光、热）、metrology-cyan（测量、HUD、标尺）、line-white（线稿）。
# - 所有尺寸未公开的部件（收集镜、照明分面镜、投影镜、掩模版尺寸、pellicle 支架间距）一律标「示意」，不写数字。
# - 本段没有使用 C 级事实；F5（等离子体温度，disputed/C）刻意不上屏。
#
# 建模模块
#   已有：build_source.{collector, collector_housing, plasma, debris, pancake, laser_beam, euv_cone,
#         light_rays, intermediate_focus, droplet_stream, nozzle}；build_vacuum.{chamber, source_vessel}；
#         materials.multilayer_mirror；styles.apply_style(photoreal|xray|blueprint|energy)
#   新增（计划 §7）：
#     build_vacuum.{vacuum_pumps, ion_shrapnel, h2_buffer, ion_drag, snh4_cleaning, h2_plasma_glow}
#     build_optics.{multilayer_section, bragg_wavelets, mirror_blank, powers_of_ten_rig, atomic_lattice,
#                   mirror_mount, analogy_moon_golf, metrology_chamber, po_module, ledger_beam,
#                   illum_module, facet_array, pupil_patterns, intensity_terrain}
#     build_mask.{reticle, mask_section, absorber_pattern, opc_pattern, dust_particle, handler_robot,
#                 pellicle, defocus_rig}
#     build_wafer.{wafer_dies, resist_lines}；build_machine.{scanner_shell, optical_path}；pdk_patterns.sky130_metal
#     styles.clay、styles.sem（计划 §1c 新增两种语言）
#   2D：manim:<Scene>；后期叠加：overlay:<name>（light_ledger、si_atom_ruler、scale_bar、fact_label、
#       chapter_tag、demo_tag、quote_card、hud_frame）
# ───────────────────────── B2 真空、氢气与碎屑（75 s）─────────────────────────
# ───────────────────────── B3 收集镜：把爆炸的光收回来（45 s）─────────────────────────
# ───────────────────────── B4 多层膜与原子级的镜子（120 s）─────────────────────────
# ───────────────────────── B5 照明系统：会变形的镜子墙（55 s）─────────────────────────
# ───────────────────────── B6 掩模：芯片的底片（100 s）─────────────────────────
shots:
- id: B2_01
  segment: B2
  duration: 5.0
  vo:
  - 光造出来了，接下来得保护好它。
  facts: []
  style: photoreal
  style_why: 承接 B1 的爆炸余波，先让观众看到“真东西”所处的环境——昏暗腔体里刚亮起的收集镜，危险感来自真实的质感。
  transition_in: dissolve
  visual: 主脉冲的闪白刚褪去，收集镜的钼硅虹彩表面在暗腔中缓缓亮起；一束紫色 EUV 替身光锥离开镜面射向画外的中间焦点；前景里几粒尚在发光的锡碎屑正慢慢朝镜面飘去，像落向玻璃的火星。
  camera:
    move: push-in
    lens_mm: 85
    fstop: 2.0
    notes: 与 B1 CamCollector 同侧机位，低角度贴着镜缘缓推，前景碎屑虚焦
  builders:
  - build_vacuum.chamber
