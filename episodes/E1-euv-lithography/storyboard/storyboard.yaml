- id: A0_01
  segment: A0
  duration: 10.8
  hold: 1.4
  lead: 1.0
  vo:
  - 这是一滴锡，比头发丝还细。下一瞬间，它会被激光连打两次，炸成一团发出极紫外光的等离子体。
