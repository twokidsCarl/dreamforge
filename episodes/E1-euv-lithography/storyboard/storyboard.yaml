  camera:
    move: locked-off
    lens_mm: 100
    fstop: 1.4
    notes: 焦平面刚好落在锡滴轨迹上，进出画都虚；沿用 sample_b1 的 Key/Rim 布光
  ref: sample_b1:CamPrePulse
  builders:
  - build_source.droplet
  - build_vacuum.chamber
  fx:
  - shallow_dof
  - motion_blur
  - flash_white
  - debris_particles
  - led_bokeh
  overlays:
  - text: 锡滴 ≈ 25 μm（头发丝约 80 μm）
    facts:
    - F3
    - F44
  engine: cycles
  sfx:
  - 低频嗡鸣淡入
  - 锡滴掠过的极轻气流声
