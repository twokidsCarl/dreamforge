# 分镜总览页的外壳。storyboard_page.py 只读这里，不再把这一期的标题写进工具。
document_title: 光刻机分镜总览
kicker: Dreamforge · 极紫外光刻机 · 分镜第一版
title: 一台光刻机里发生了什么
lede: 约 20 分钟单集。先讲为什么需要 EUV，再沿着光的路线拆开机器里的每个子系统，最后用一条长镜头总装。每个镜头按“它在回答什么问题”选择画面语言；所有上屏数字都能追溯到事实库编号。
frames_label: 已渲染的画面 · 同一场景的四种语言，以及 B1 样片
rules:
  - 同一种画面语言连续不超过 3 个镜头（C 段长镜头除外）。
  - 每段至少用 3 种语言；切换要有动机：线稿实体化、扫描光带、结构淡出只剩能量、显微拉近。
  - 全片共用四个强调色：EUV 紫、激光橙、计量青、线稿白；同一物体跨风格保持同一构图。
  - 三条主线反复出现：光的账本、硅原子标尺、暴力与温柔。
  - 上屏数字必须带事实编号；媒体来源一律标“据报道”。
acts:
  A0: 序
  A1: 第一幕 · 为什么需要 EUV
  B1: 第二幕 · 机器内部
  C: 第三幕 · 总装
  D: 尾声
accents:
