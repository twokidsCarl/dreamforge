# How the narrator should say things. shared/tools/speech_text.py applies these before TTS;
# subtitles keep the original script text. Order matters: longer keys first.
# Numbers are handled by rules (years digit by digit, 两 for 2 before 百/千/万/亿/倍/个…, percents,
# decimals); this file is for acronyms, names and units.

lexicon:
  High-NA: "High N A"
  ASML: "A S M L"
  EUV: "E U V"
  DUV: "D U V"
  NXE: "N X E"
  EXE: "E X E"
  TB: "T B"
  AI: "A I"

# unit letters that follow a number: "8 g" -> "8 G"
units_after_number:
  g: "G"
