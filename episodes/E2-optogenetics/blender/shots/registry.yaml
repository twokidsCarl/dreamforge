# 分镜 id -> 怎么渲。126 镜全部登记，key 与 storyboard.timed.yaml 的 id 一一对应（shared/tools/build_check.py 核对）。
#
# 3D 镜头（shared/tools/render_storyboard.py）：
#   scene: 本目录下的模块，提供 build(**args)；camera: 场景里的相机；start: 起始模拟帧；style: 画面语言；engine: eevee | cycles
#   raw: true 时帧写到 shots/<id>/<quality>_raw/，再由 mograph 里同 id 的后处理叠中文标注，写到 <quality>/。
#     后处理：A0_04a 在 mograph/a0.py；B_02a、B_03a、B_04a、B_16b、B_18a 在 mograph/b.py；C_01a、C_07a 在 mograph/c.py
#     （共用件 mograph/raw_overlay.py；要叠的字和锚点空物体 LabelAnchor_* 写在 b_scenes.py / c_scenes.py 文件头）。
#   documentary 不是 styles.py 里的风格：场景自带灯光和世界，不再套风格。
#   B_04a、B_06a、B_16b：分镜 engine 写 manim，但画的是膜、通道和卵母细胞（builder: parametric_blender），
#     WORKFLOW 6.4 要求核心结构用参数化 Blender，所以改在 Blender 里用 EEVEE + blueprint 风格做。
#   起始帧不是 1 的镜头（A0_02b、A_01b、A_06b、B_03b、B_07b、B_09b、D_01b 等）是同一场景里另一段时间表，
#     按当前 timed 时长算出；retime 之后要重算（见各模块文件头）。
#
# 2D 镜头（shared/tools/mograph.py --shot <id>）：只写 mograph: <模块>（mograph/<模块>.py 里的 @shot），style、engine 照分镜。
#   已写：mograph/a0.py、a.py、b.py、c.py、d.py——各段全部 2D 镜头（b.py、c.py 里还有 raw 镜头的叠字后处理）。
#   engine: manim 的 2D 镜头本机没有 manim，按 Pillow mograph 实现（A_04b、A_05b、B_20a、C_16a、C_19b、C_91 已改记 pillow）。
#
# 镜头长度来自 storyboard.timed.yaml（没有时回退 storyboard.yaml 的 duration）。


