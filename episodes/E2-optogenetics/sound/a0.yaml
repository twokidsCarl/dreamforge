# A0 冷开场的声音设计（P9）。成片标准段：配乐 + 音效，无嗓音。
#
# 复现：
#   DREAMFORGE_EPISODE=E2-optogenetics .venv/bin/python shared/tools/sound_gen.py A0 --dry-run   # 只看哪些请求要花钱
#   DREAMFORGE_EPISODE=E2-optogenetics .venv/bin/python shared/tools/sound_gen.py A0             # 生成（已缓存的不再请求）
#   DREAMFORGE_EPISODE=E2-optogenetics .venv/bin/python shared/tools/sound_gen.py A0 --check     # 每条音效落在旁白空档还是压在词上
# 生成物按请求哈希缓存在 episodes/E2-optogenetics/audio/eleven/{music,sfx}/（不入库）。
# 混音：shared/tools/edit_film.py（配乐侧链 0.03/6，音效侧链 0.04/3，loudnorm I=-16 TP=-1.5，见 WORKFLOW 第 7 节）。
#
# 时间轴（全局秒 = A0 起点 0；镜头起点见 storyboard.timed.yaml）。
# 词级时间戳：review_words.py audio/vo/Andre/vo_track.wav 0 61.12（2026-10-21，float32）；
# 旁白空档：ffmpeg silencedetect n=-40dB d=0.25。≥ 0.6 秒的空档：
#   0.00–1.29   冷开场，只有室内底噪
#   3.45–5.60   「……也许是光」之后（A0_01b 引文停一拍）
#   7.62–8.37   「随即停住」之后
#  10.01–12.17  「相当牵强」之后（A0_02b）
#  17.15–18.15  「或者关掉」之后
#  21.17–23.32  「而且要快」之后（A0_03b 白模放电）
#  28.66–29.46  「Karl Deisseroth」之后
#  38.13–40.28  「光遗传学」（理由句）之后（A0_04b 三个名字）
#  48.80–51.00  「能用光拨动的开关」之后（A0_05b 光走到一半熄灭）
#  54.86–61.12  片名「《光遗传学》」之后到段尾（A0_06a 停顿、A0_06b、A0_91、A0_92）
#
# 关键词（不许被盖住）：光（3.18）、相当牵强（8.92–10.00）、打开（15.62–16.04）、关掉（16.66–17.12）、
#   要快（20.52–21.12）、2026 年 10 月 5 日（23.08–24.82）、三个名字（27.80–31.58）、光控离子通道（33.96–35.32）、
#   光遗传学（37.32–38.08）、开关（48.38–48.76 / 52.10–52.46）、片名《光遗传学》（53.72–54.84）。
# 规则：冲击音（放电、落定、片名）只放在上面的空档里。和画面动作同步、不得不压在词上的提示音（打字、开 / 关、
#   三个光点）写明 over_vo 理由，增益不高于 -22 dB，且时长短于所在的词组；成片用 review_asr.py 核对，转写要与纯旁白一致。

# ---- 配乐 -------------------------------------------------------------------------------------------
# v3（P9）：eleven.music(plan=…)，composition_plan 按旁白段落写结构，全局排除人声和鼓。
# 在「光」字之后的空档进（3.4 s，冷开场前 3 秒只有室内底噪）。各段时长对准旁白的段落边界：
#   quote 3.4–11.8 | method 11.8–23.0 | prize 23.0–39.9 | missing 39.9–50.6 | title 50.6–56.8 | decay 56.8–66.0
# 片名「光遗传学」53.7 s 落在 title 段（和弦解决），之后 decay 段只留长音自然衰减，落进 edit_film --tail 的淡出。
# 旧版：v2 = music/ef5d21f9c2443180.mp3（prompt 生成，68 s，at 3.0, -9 dB），A0_sample_v2 用的就是它。
music:
  - at: 3.4
    gain: -15                     # 120 Hz 高通后 -30.1 LUFS（sound_gen.py --check），与已通过的 v2（-9 dB 时 -29.7）持平
    fade_out: 1.5
    file: music/4d4c6b60fb70c3bd.mp3   # = eleven.music_path(plan)，sound_gen.py 核对
    plan:
      positive_global_styles:
        - instrumental underscore
        - science documentary cold open
        - quiet, sparse, restrained
        - cool and dark, glassy, precise
        - soft analog synth pad, felt piano, distant celesta, high soft strings
        - slow, around 66 bpm, no beat
        - even dynamics, leaves room for narration
      negative_global_styles: [vocals, voice, singing, choir, humming, spoken word, vocal chops, lyrics, whisper,
                               drums, percussion, heavy bass, sub bass, "808", distortion, aggressive, epic, trailer,
                               big build-up, risers]
      sections:
        - section_name: quote
          positive_local_styles: [single low sustained synth pad, a few isolated felt piano notes, dark, almost still]
          negative_local_styles: [loud, melody, vocals]
          duration_ms: 8400
          lines: []
        - section_name: method
          positive_local_styles: [a soft muted pulsing synth arpeggio enters, slight forward motion, still quiet, precise]
          negative_local_styles: [loud, drums, vocals]
          duration_ms: 11200
          lines: []
        - section_name: prize
          positive_local_styles: [warm soft high strings join the pad, gently brighter, dignified, steady, restrained]
          negative_local_styles: [loud, triumphant fanfare, brass, drums, vocals]
          duration_ms: 16900
          lines: []
        - section_name: missing
          positive_local_styles: [thinning out, suspended unresolved chord, quiet tension, a lone celesta note, near silence at the end]
          negative_local_styles: [loud, resolution, drums, vocals]
          duration_ms: 10700
          lines: []
        - section_name: title
          positive_local_styles: [gentle warm resolving chord on soft pad and strings, a single soft celesta shimmer, calm arrival]
          negative_local_styles: [loud, impact, drums, vocals]
          duration_ms: 6200
          lines: []
        - section_name: decay
          positive_local_styles: [the final chord sustains and fades naturally to silence, no new notes]
          negative_local_styles: [new melody, drums, vocals, abrupt ending]
          duration_ms: 9200
          lines: []

