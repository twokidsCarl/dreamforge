# 分镜总览页的外壳。标题、简介和强调色只描述《光遗传学》。
document_title: 光遗传学分镜总览
kicker: Dreamforge · 光遗传学 · 分镜总览
title: 光遗传学
lede: 12–15 分钟。冷开场用「理想的信号，也许是光」接到 2026 年诺奖的三个人；第一幕说明只记录活动为什么证明不了因果；第二幕把这枚开关从紫膜拆到通道视紫红质，并分开论文署名和获奖名单；第三幕只深讲小鼠海马里的虚假恐惧记忆，以及视觉临床仍然停在部分恢复、尚未获批的边界；尾声停住，不预告下一期。核心结构用参数化模型，上屏数字回到事实编号。
frames_label: 已渲染的画面
rules:
  - 同一种画面语言连续不超过 3 个镜头。
  - 每段至少用 3 种语言；每一镜都要写明为什么用这种语言。
  - 全片四个强调色：通道蓝、抑制琥珀、膜青、线稿白。蓝光表示打开，琥珀表示关掉。
  - 通道、膜、神经元、离子流、视网膜和耳蜗剖面用参数化模型，不拿生成网格代替。
  - 上屏数字必须带事实编号。人物不画写实脸，动物实验不血腥。
acts:
