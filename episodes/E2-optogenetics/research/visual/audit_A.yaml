# E2 视觉事实核查表，A 第一幕（锋电位 → 相关与因果 → 缺一枚开关 → 食欲素与觉醒）。每行是画面里出现的一项结构、文字或数字（旁白的论断在 research/facts.yaml）。
# status: sourced / wrong / unsourced / simplified / artistic（WORKFLOW 2.3）。几何依据见 blender/shots/a_scenes.py 和各 builder 文件头
#   （build_bilayer、build_opsin、build_brain、build_props）。
# 规则：本段还有 wrong 或 unsourced 时不能出成片。
# 2026-10-21 首版（P6）。3D 镜头按 a_scenes.py 核；2D 镜头（mograph: a）还没写，按分镜 visual 核，写代码时照此对字。
# 现有 unsourced：A_02b「损毁」图标（facts.yaml 没有「损毁组织看行为」这一条，F2 只写记录与因果）。改法写在 note 里。
# 锋电位的离子机制（A_01a/01b）是教科书通识，facts.yaml 没有单独条目；画面只画示意、不上文字和数字，记 simplified。
A_01a:
  - item: 参数化脂质双层剖面（亲水头朝外、疏水尾朝里），上面三个通用离子孔
    status: simplified
    source: build_bilayer 文件头（双层厚约 4 nm，Alberts《Molecular Biology of the Cell》第 10 章）；build_opsin 文件头（通用离子孔，n 根桶板）
    note: 孔不对应任何具体电压门控通道；离子画成放大很多倍的发光小球
  - item: 静息时膜外一排「+」、膜内一排「−」，锋电位时阳离子穿孔进入、两侧符号翻过来再翻回
    status: simplified
    source: 教科书通识（Kandel《Principles of Neural Science》锋电位一章的通用示意）
    note: facts.yaml 没有锋电位离子机制的条目；画面不标离子名、不标电压数值。符号个数不代表电荷量
  - item: 前上方一条膜电位曲线猛地翻上去再回来，无刻度
    status: simplified
    source: F6（锋电位是毫秒尺度的事件）
    note: 曲线形状是 e2_shot.spike_shape 的示意，不是实测记录；不带时间轴和毫伏刻度
A_01b:
  - item: 同一场景近景，膜内侧发光板在锋电位时亮起再熄灭
    status: artistic
    note: 「电位光」是能量图的叙事表现，不是任何可测量的光；蓝是全片「打开」约定色
A_02a:
  - item: 暗室实验台上一块浅米灰风格化组织块，一根记录电极下探，后面显示器上慢慢画出一串锋电位痕迹；无人物、无血
    status: simplified
    source: F2（20 世纪方法是被动记录脑活动）；build_props（electrode、screen、bench，参数化低细节示意）
    note: 组织块不是真组织；痕迹是 S.spike_train 的示意，不对应任何真实记录，不带刻度
  - item: 组织上一圈细环标出一小块（分镜：「一块组织示意被标记」）
    status: simplified
    source: F2
    note: 只读作「这一块在被研究」。若 A_02b 的「损毁」补不到出处，这圈细环也不要读成损毁部位
A_02b:
  - item: 图标「记录」
    status: sourced
    source: F2（被动记录脑活动）
  - item: 图标「损毁」（旁白：「也能损毁一块组织，看行为缺了什么」）
    status: unsourced
    note: facts.yaml 里 F2 只写「从被动记录转到主动控制」和「20 世纪的方法证明不了因果」，没有损毁 / 毁损研究。
      改法二选一：回读诺奖新闻稿和科学背景，若有 lesion 一类的原句就补进 F2 notes，改记 sourced；没有就屏幕只留「记录」一个图标，
      旁白的「损毁」交 Luna 决定（改旁白要重录）
  - item: 底下同一行「证明不了因果」
    status: sourced
    source: F2（新闻稿：20 世纪的方法证明不了因果关系）
