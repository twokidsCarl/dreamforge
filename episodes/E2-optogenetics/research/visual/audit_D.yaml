# 现有 unsourced：无。D_02b 原句「人体记忆：无对应结果」读起来像全称否定，同日改成「人体记忆：本研究不涉及」，与 C_06a 一致（F9）。
# 留意：D_03a / D_03b 的「相当牵强」只挂 1999（F3），这两镜不能配 1979 标签（F3b notes）。
D_01a:
  - item: 一排 9 个参数化神经元（与 A0_03b 同一套种子和排布），只有被圈的那一类先被蓝光打开、沿轴突放电，再被琥珀光按住；两侧始终暗
    status: simplified
    source: F3（只打开或关掉某一类神经元，其余大体不动）；F8（蓝光开、黄光关的双向光控）；F2（主动控制、建立因果）；build_neuron 文件头
    note: 神经元形态通用，不对应具体脑区或细胞类型；蓝 / 琥珀是全片开 / 关约定色。琥珀光时蓝光仍在，表达「按住」，不是论文里的光照方案
  - item: 被选中的胞体上嵌着缩小的通道视紫红质（蓝）和氯泵（琥珀）：蓝光时通道孔亮，琥珀光时泵的视黄醛亮、通道熄灭
    status: simplified
    source: F8（同一回路里 ChR2 与 NpHR 双向光控）；build_opsin
    note: 蛋白和胞体的比例差了几个数量级，这里只为同框可读
D_01b:
  - item: 同一场景锁定近景，只看中间那一个被选中的神经元：先蓝后琥珀
    status: simplified
