# E2 视觉事实核查表，B 第二幕（紫膜与细菌视紫红质 → 泵和通道 → 衣藻与 ChR1/ChR2 → 2005 神经元 → 名词 → 活体光纤 → NpHR 双向
#   → 红移工具 → 两份荣誉名单）。每行是画面里出现的一项结构、文字或数字（旁白的论断在 research/facts.yaml）。
# status: sourced / wrong / unsourced / simplified / artistic（WORKFLOW 2.3）。几何依据见 blender/shots/b_scenes.py、b_cell_scenes.py
#   和各 builder 文件头（build_opsin、build_bilayer、build_purple_membrane、build_cell、build_brain、build_props）。
# 规则：本段还有 wrong 或 unsourced 时不能出成片。
# 2026-10-21 首版（P6）。3D 镜头按场景代码核；raw 镜头（B_02a、B_03a、B_04a、B_16b、B_18a）的叠字按 mograph/b.py 核；
#   其余 2D 镜头（mograph: b）还没写，按分镜 visual 核，写代码时照此对字。
# 同日顺手改了 b_scenes.py 文件头里过时的事实编号（ChR1 / ChR2 / 截短 → F5，NpHR → F8），只改注释，不影响渲染。
# 现有 unsourced：0（2026-10-21 补齐）。
#   B_06a「加上视黄醛」→ sourced（F5 notes：Nagel 2002 摘要 in the presence of all-trans retinal；诺奖科学背景 introducing all-trans-retinal）；
#     「细胞自己没有这套感光系统」拆出一条记 simplified。
#   B_18a / B_18b「ChrimsonR 敏感更长波长」→ sourced（新增 F17：Klapoetke et al. 2014，Chrimson 红移约 45 nm，ChrimsonR 保留红移光谱）。
B_01a:
  - item: 嗜盐古菌的杆状细胞表面，几块颜色更深的膜斑（紫膜），慢推到最大一块；电镜灰度风格
    status: simplified
    source: F4（盐杆菌 Halobacterium halobium 的紫膜呈深紫色）；b_scenes.py 文件头
    note: 斑块大小、形状、个数是示意；杆状外形是通用描述，facts.yaml 没有写。sem 是风格，不冒充原子分辨率照片。
      菌名：F4 按 1971 论文写 H. halobium，b_scenes.py 写现名 H. salinarum，屏幕不上拉丁菌名就不冲突
B_01b:
  - item: 一张紫膜片从下方升到镜头前，上面只有 bR 三聚体一种蛋白，排成六方晶格
    status: simplified
    source: F4（该片段里只有这一种蛋白）；build_purple_membrane 文件头（P3，晶胞约 62 Å：Krebs & Isenbarger 2000）
    note: 单体内 7 根螺旋的排布是示意，不是 Henderson 1990 的密度图坐标
B_02a:
  - item: 紫膜三聚体晶格从俯视慢推到一个单体，单体里嵌着视黄醛
    status: simplified
    source: F4（紫色来自视黄醛结合在一种视紫红质样蛋白上）；build_purple_membrane；build_opsin 文件头
    note: br_lattice 的单体缩到 0.72 倍、中心距仍取 62 Å，避免螺旋穿插（比例 simplified）
  - item: 叠字「膜片段里只有这一种蛋白」（mograph/b.py，锚点 LabelAnchor_onlyone）
    status: sourced
    source: F4
B_02b:
  - item: 视黄醛在光下闪一下，蛋白骨架不动
    status: simplified
