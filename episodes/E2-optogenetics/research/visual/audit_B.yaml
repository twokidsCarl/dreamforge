    note: 是两个物体（分镜要求）；没有手，也没有人
B_05a:
  - item: 一枚参数化衣藻在暗水里朝一束光游过去：卵形细胞体、两根前端鞭毛、杯状叶绿体、赤道旁橙红眼点；游动时绕长轴自转
    status: simplified
    source: F1（衣藻朝光游，Hegemann 想弄清它如何朝光游）；build_cell 文件头（Harris《The Chlamydomonas Sourcebook》的通用形态）
    note: 细胞长 10 µm、鞭毛 11 µm 只是建模取值，不上屏；鞭毛拍频从约 50 Hz 放慢成每 0.5 秒一拍（artistic）；自转速度示意
B_05b:
  - item: 衣藻特写，眼点处一道快速电流沿细胞表面亮到鞭毛基部，随后细胞转向光源
    status: simplified
    source: F3c（Harz & Hegemann 1991：衣藻里潜伏期只有微秒级的感光电流）；F1
    note: 电流的路径和颜色是示意，不是实测的电流分布；不标「微秒」以外的数字
B_06a:
  - item: 蓝图：衣藻蛋白的基因（DNA 双螺旋示意 + 箭头）指向一枚爪蟾卵母细胞，膜上出现通道位点
    status: simplified
    source: F5（Nagel 等 2002：把衣藻 Channelopsin-1 表达在爪蟾卵母细胞里）；build_cell 文件头（VI 期卵母细胞外观，Dumont 1972）
    note: 位点个数不按真实表达密度
  - item: 旁白「细胞自己没有这套感光系统」（画面上卵母细胞膜旁原本没有视黄醛）
    status: simplified
    source: F5 notes
    note: 叙事衔接：爪蟾卵母细胞不是衣藻的天然感光系统。不是论文原句
  - item: 加上视黄醛（锯齿小分子示意）落到膜旁（旁白：「可是加上视黄醛、再给光」）
    status: sourced
