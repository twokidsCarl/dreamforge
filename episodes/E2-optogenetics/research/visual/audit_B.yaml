    note: 闪光只表示「吸光的是视黄醛」，不画异构化，不标波长
B_03a:
  - item: 单个 bR 剖面，三次闪光，每次视黄醛光晕紫 → 黄 → 紫，一个质子从膜一侧被送到另一侧
    status: simplified
    source: F4b（闪光使吸收峰从 560 nm 短暂移到 415 nm，伴随质子释放和摄取；在膜上定向搬运质子）
    note: 颜色只示意吸收变化，不标波长；中间态名称（M）不上屏，facts.yaml 没有。代码里方向是胞内 → 胞外，F4b 只写「定向」，
      屏幕不写方向文字
  - item: 叠字「细菌视紫红质 · 质子泵」（mograph/b.py，锚点 LabelAnchor_bR）
    status: sourced
    source: F4b（1973 命名 bacteriorhodopsin；光驱动的质子泵）
    note: 不写成通道（F4b notes）
B_03b:
  - item: 收尾状态：膜一侧质子多、另一侧少（pH 一高一低）
    status: simplified
    source: F4b
    note: 质子个数不代表浓度；不标 pH 数值
B_04a:
  - item: 左右两张膜，左泵（螺旋紧密、无贯通孔，箭头逆梯度），右通道（孔开，离子顺梯度）
    status: simplified
    source: F4b（泵）；F5（通道）；build_opsin 文件头（泵没有贯通孔，通道孔在 TM1/2/3/7 之间）
    note: 「顺 / 逆电化学梯度」是教科书通识，facts.yaml 没有单独条目；箭头是示意。两张是两个物体，不混成一个分子
