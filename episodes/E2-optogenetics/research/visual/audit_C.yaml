    status: simplified
    source: build_brain 文件头（Allen Mouse Brain CCFv3 大体分区，Wang et al. 2020 Cell 181:936）
    note: 部件都是椭球，比例不是毫米真值；细胞点是随机撒的，个数不代表细胞数
