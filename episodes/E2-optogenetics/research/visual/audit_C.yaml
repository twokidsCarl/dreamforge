# E2 视觉事实核查表，C 第三幕（假记忆 + 视觉临床路径 + 边界）。每行是画面里出现的一项结构、文字或数字（旁白的论断在 research/facts.yaml）。
# status: sourced / wrong / unsourced / simplified / artistic（WORKFLOW 2.3）。几何依据见 blender/shots/c_scenes.py 和各 builder 文件头。
# 规则：本段还有 wrong 或 unsourced 时不能出成片。
# 2026-10-21 首版（P6）。3D 镜头按场景代码核；2D 镜头（mograph: c）除 C_07a 的叠字外还没写，按分镜 visual 核，写代码时照此对字。
# 现有 unsourced：C_06a 第二行、C_10a「高对比轮廓」。都在还没写的 2D 镜头或旁白措辞上，改法写在 note 里。
