  segments: [B]

F8:
  claim: Aravanis 等 2007 年用光纤把 473 nm 的光送进啮齿动物运动皮层，在不另加视黄醛的情况下，驱动表达 ChR2 的兴奋性神经元并产生行为输出。Zhang 等 2007 年在 Nature 报告古菌氯离子泵 NpHR：黄光下把氯离子泵入细胞、抑制锋电位，作用光谱与蓝光激活的 ChR2 分开，因此可以在同一回路里做双向光控。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1088/1741-2560/4/3/s02
    - https://doi.org/10.1038/nature05744
  notes: 诺奖科学背景还提到 Han 与 Boyden 2007 的另一项 NpHR 工作。本轮没有打开那篇论文，旁白不单独报它的刊名或 DOI。光纤直径、功率等数字只在需要上屏时再用本条来源里的原值，本片定稿不报。
  segments: [B]

F9:
  claim: Ramirez 等 2013 年在 Science 报告：在小鼠海马齿状回，把某一环境里活跃过的神经元标上 ChR2；之后在另一个环境里做恐惧条件化时，用光重新激活这些细胞。实验组后来会在最初那个从未给予足底电击的环境里冻结。作者把这称为在小鼠里制造出一段虚假的恐惧记忆。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1126/science.1239073
    - https://www.science.org/doi/10.1126/science.1239073
  notes: 对象是小鼠，不是人。不要写成改写人类记忆、操控思想或洗脑。诺奖科学背景描述了利根川实验室用 ChR2 标记齿状回细胞并做光学再激活，本轮 PDF 摘录没有出现 Ramirez 这个名字；论文归属以 Science 页面为准。
  segments: [C]

F10:
  claim: Adamantidis、Zhang、Aravanis、Deisseroth、de Lecea 2007 年在 Nature 报告：把 ChR2 表达在小鼠下丘脑外侧的 hypocretin（食欲素）神经元上，经光纤光刺激会提高从慢波睡眠或快速眼动睡眠转入清醒的概率。5–30 Hz 的脉冲缩短转入清醒的潜伏期，1 Hz 则没有。论文要回答的是：这些神经元的放电足以驱动觉醒，还是仅仅与觉醒相关。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1038/nature06310
  notes: 大纲原先没有单独的 beat。定稿若用，只说明因果实验，不展开睡眠疾病。
  segments: [A]

F11:
  claim: Sahel 等 2021 年在 Nature Medicine 报告一名视网膜色素变性、已盲的患者：玻璃体内注射编码 ChrimsonR 的腺相关病毒，再用护目镜把外界光变化投射成视网膜上的光脉冲，激活转导后的视网膜神经节细胞。患者只用接受治疗的那只眼、并且戴着护目镜时，能够知觉、定位、计数并触碰物体。注射前无论戴不戴护目镜，以及注射后不戴护目镜，都不能看见这些物体。论文称之为神经退行性疾病中光遗传治疗后的首次部分功能恢复。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1038/s41591-021-01351-4
    - https://www.nature.com/articles/s41591-021-01351-4
  notes: 只说部分恢复，而且离不开护目镜。不要说治愈失明或治好盲人。不报视力表数字，本轮摘要没有给出可单独引用的视力分数。
  segments: [C]

F12:
