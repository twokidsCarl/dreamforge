  notes: 公司公告正文没有 PDUFA 日期。计划表里的「约 2027 上半年」本轮不采用，不进旁白。不要说 MCO-010 已上市。公司文案里的 vision restoration、standard of care 是申请方的期待，旁白只复述受理事实和公告里的终点，不跟着说成已经治愈。
  segments: [C]

F13:
