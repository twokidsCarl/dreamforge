  grade: A
  status: verified
  sources:
    - https://www.gensight-biologics.com/2026/10/08/gensight-biologics-and-the-15-20-national-hospital-announce-nejm-publication-on-gs030-phase-1-2-trial-results-in-late-stage-retinitis-pigmentosa/
  notes: 本轮没有打开 NEJM 全文，不写 DOI、卷号或页码。杂志标题按公司公告为 Optogenetic Therapy for Restoring Aspects of Visual Function，旁白不要把标题说成已经恢复视力。不要采用媒体里的「7/10」。
  segments: [C]

