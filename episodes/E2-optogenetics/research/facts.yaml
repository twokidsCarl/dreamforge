F1:
  claim: 2026-10-05 诺贝尔生理学或医学奖联合授予 Karl Deisseroth、Peter Hegemann、Georg Nagel，理由是光控离子通道与光遗传学。新闻稿没有把 Edward Boyden 列为得主。新闻稿还写：Hegemann 想弄清衣藻如何朝光游；他与 Nagel 在 21 世纪初发现 channelrhodopsin，蓝光打开蛋白上的通道，离子流入并产生电脉冲；Deisseroth 把这种蛋白做成神经元的光控开关，2005 年发表这一突破，约两年后在活体小鼠脑中做成。
  grade: A
  status: verified
  sources:
    - https://www.nobelprize.org/prizes/medicine/2026/press-release/
  notes: 奖金 1200 万瑞典克朗均分，旁白不必报。新闻稿把 2005 年的发表记在 Deisseroth 名下；论文署名见 F6，第一作者是 Boyden。新闻稿说临床是在尝试恢复视力，不要说成已经治好。
  segments: [A0, B4, B7]

F2:
  claim: 2026 诺奖科学背景写明，这一方法让神经科学从被动记录脑活动，转到主动控制它，从而建立因果。新闻稿写明，20 世纪的方法证明不了因果关系。
  grade: A
  status: verified
  sources:
    - https://www.nobelprize.org/uploads/2026/10/advanced-medicineprize2026.pdf
    - https://www.nobelprize.org/prizes/medicine/2026/press-release/
  notes: 「从读到写」是对 recording → controlling 的转述，不是 PDF 里的原词。本轮没有给 PDF 编页码。
  segments: [A]

F3:
  claim: 2026 诺奖科学背景把下面这段设想归于 Crick 1999：理想的信号是光；他当时认为这相当牵强（rather far-fetched）；可用的方法应能只打开或关掉某一类神经元，其余大体不动。
  grade: A
  status: verified
  sources:
    - https://www.nobelprize.org/uploads/2026/10/advanced-medicineprize2026.pdf
  notes: PDF 引文括注是 Crick, 1999，参考文献写 Phil Trans R Soc Lond B。Boyden 等转述的 1999 原话与诺奖科学背景一致（ideal signal would be light；rather far-fetched）。1979 没有同一句，见已核实的 F3b。不要叙述「47 年」。
  segments: [A0, D]

F3b:
  claim: 1979 年 Crick《科学美国人》Thinking about the Brain（Sci Am 241:219–232）提出需要能「只灭活某一类神经元、其余大体不动」的方法，但没有写「理想信号是光」或「相当牵强」；后两句属于 Crick 1999（Phil Trans R Soc Lond B 354:2021–2025）。
  grade: A
  status: verified
  sources:
    - https://www.nobelprize.org/uploads/2026/10/advanced-medicineprize2026.pdf
    - https://www.scientificamerican.com/article/controlling-the-brain-with-light/
    - https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.0020419
    - https://pharmrev.aspetjournals.org/article/S0031-6997(24)00796-8/fulltext
    - https://doi.org/10.1017/S0033583523000033
    - https://synthneuro.org/wp-content/uploads/2021/08/19-12-boyden.pdf
    - https://doi.org/10.1038/scientificamerican0979-219
    - https://doi.org/10.1098/rstb.1999.0541
  notes: |
    Sci Am 1979 全文仍付费墙，本轮没有逐页 OCR；结论依据：
    （1）诺奖科学背景把「理想信号是光 / rather far-fetched」括注为 Crick, 1999，1979 只与 1999 并列作为「早先展望」；
    （2）Deisseroth 2010 写明 1979 是「控制一类细胞」的需求，光控是他后来在讲座里的推测；
    （3）Siegel & Callaway 2004（与 Crick 共事者）列举 1979 文中三种所需方法，不含光；
    （4）Pharmacol Rev、QRB 等谨慎综述均把灭活需求归 1979、把光归后续/1999；
    （5）Boyden 文直接引用 1999 的 light / far-fetched 原句。
    部分二手文章会把光误记到 1979，不可采。
    2026-10-21 Carl HARD：冷开场由 1979 起头（只讲「只动一类神经元、其余大体不动」的要求），检查点①决定 1 作废。
    旁白和屏幕上 1979 只配这条要求；「理想信号是光 / 相当牵强」仍只挂 1999（F3）。「后来在讲座里猜过光」不写年份，
    1979 与 1999 之间不编 Crick 讲座的具体年份。不说「47 年」，屏幕上不写年份差。
    若日后打开 1979 全文，只需复核「灭活」原句页码，不必改结论方向。
  segments: [A0]

F3c:
  claim: 2026 诺奖科学背景写明微生物光敏膜蛋白的两条早期线索（年份落在 Crick 1979 与 1999 之间是我们的对照，不是 PDF 原话）：1977 年 Matsuno-Yagi 与 Mukohata 在缺少细菌视紫红质的突变株里观察到光致超极化，随后分离出 halorhodopsin（Mukohata & Kaji 1981）；与古菌泵的研究同时，Harz 与 Hegemann 1991 年在衣藻里测到潜伏期只有微秒级的感光电流，Hegemann 组据此提出感光的视紫红质与离子通道紧密相连、也许就是同一个蛋白复合体（Harz 等 1992；Holland 等 1996）。
  grade: A
  status: verified
  sources:
    - https://www.nobelprize.org/uploads/2026/10/advanced-medicineprize2026.pdf
    - Mukohata Y, Kaji Y (1981) Arch Biochem Biophys 206:72–76
    - Harz H, Hegemann P (1991) Nature 351:489–491
    - Harz H et al. (1992) Phil Trans R Soc Lond B 338:39–52
    - Holland EM et al. (1996) Biophys J 70:924–931
  notes: |
    等级按诺奖科学背景（A）；四篇论文是 PDF 的参考文献条目，本轮没有打开论文页面，不写 DOI、不引原文数字。
    冷开场只作 HUD / 剪影，不展开第二幕：不出现 channelrhodopsin、ChR1/ChR2、2002/2003，不讲紫膜全过程。
    1981 是 halorhodopsin 的分离；「光驱动氯离子泵」在 PDF 里是后来对 N. pharaonis 变体的鉴定（1986–1995），不要并进 1981。
    衣藻这一条是「电流快到微秒级」和「也许同一个蛋白」的推断，不是已经找到通道蛋白；旁白只说「线索越来越多」。
  segments: [A0]

F4:
  claim: 1971 年 Oesterhelt 与 Stoeckenius 报告：盐杆菌 Halobacterium halobium 的紫膜呈深紫色，紫色来自视黄醛结合在一种视紫红质样蛋白上，该片段里只有这一种蛋白。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1038/newbio233149a0
  notes: 论文题目是 rhodopsin-like protein，不是后来的 bacteriorhodopsin。质子泵和这个名字见 F4b，年份是 1973，不要并进 1971。
  segments: [B]

F4b:
  claim: 1973 年 Oesterhelt 与 Stoeckenius 把紫膜里的那种蛋白称为 bacteriorhodopsin。闪光使吸收峰从 560 nm 短暂移到 415 nm，并伴随质子释放和摄取；他们提出，光照下这种蛋白在膜上定向搬运质子。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1073/pnas.70.10.2853
  notes: 这是光驱动的质子泵，不是后来的通道视紫红质。旁白要把泵和通道分开。
  segments: [B]

F5:
  claim: Nagel、Hegemann、Bamberg 等 2002 年在 Science 报告 channelrhodopsin-1：把衣藻 Chlamydomonas reinhardtii 的 Channelopsin-1 表达在爪蟾卵母细胞里，得到对质子有选择性的光门控电导。2003 年他们在 PNAS 报告 channelrhodopsin-2：在卵母细胞和哺乳动物细胞里，ChR2 是直接由光打开的阳离子通道，光照即可使细胞去极化。诺奖科学背景写明，保留通道部分就仍有光控电导，蛋白本身就足以作为通道。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1126/science.1072068
    - https://doi.org/10.1073/pnas.1936192100
    - https://www.nobelprize.org/uploads/2026/10/advanced-medicineprize2026.pdf
  notes: ChR1 是质子通道；ChR2 是非选择性阳离子通道，持续光照下会脱敏到较小的稳态电导。不要把两种通道说成同一种离子选择性。
  segments: [A, B]

F6:
  claim: Boyden、Zhang、Bamberg、Nagel、Deisseroth 2005 年在 Nature Neuroscience 报告：用慢病毒把 ChR2 送进培养的哺乳动物神经元，蓝光可以在毫秒尺度上可靠地驱动锋电位，并控制兴奋性和抑制性突触传递。署名顺序上 Boyden 是第一作者，Deisseroth 是通讯作者。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1038/nn1525
    - https://www.nature.com/articles/nn1525
  notes: 实验按本条。诺奖名单以 F1 为准，Boyden 不是 2026 年生理学或医学奖得主。新闻稿把 2005 年的发表记在 Deisseroth 名下，与第一作者署名同时成立，旁白要分清。
  segments: [B]

F7:
  claim: Deisseroth、Feng、Majewska、Miesenböck、Ting、Schnitzer 2006 年在 Journal of Neuroscience 使用 optogenetic 一词，讨论把光学和遗传靶向合在一起的方法。2026 诺奖科学背景写明，这一组作者正式提出 optogenetics 这个词。
  grade: B
  status: verified
  sources:
    - https://doi.org/10.1523/jneurosci.3863-06.2006
