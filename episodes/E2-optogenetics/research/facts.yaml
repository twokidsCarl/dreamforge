  claim: 2023 年 iScience 综述写明，光学人工耳蜗仍处临床前，因此还不能在人体患者中测试声音编码策略。2022 年 EMBO Molecular Medicine 把光遗传听力恢复的首次人体应用写成当时的计划，并写明可行性、安全性和听力改善仍待证明。ClinicalTrials.gov 的 NCT05110183 是一项 2025-04-20 启动、邀请入组的人体可行性研究，终点是术中光递送和听神经复合动作电位，不是已完成的光遗传听力疗效试验。
