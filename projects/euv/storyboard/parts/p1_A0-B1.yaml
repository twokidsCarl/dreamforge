- id: A0_05
  segment: A0
  duration: 5.6
  vo:
  - 箱子里，是一台拆开的机器，组装起来超过 150 吨。
  facts:
  - F16
  style: xray
  style_why: “箱子里是什么”：透明剖视让我们隔着箱壁看见拆开的机器，又不用伪造真实内部结构。
  transition_in: scan-wipe
