- id: A1_05
  segment: A1
  duration: 4.0
  vo: []
  facts: []
  style: sem
  style_why: 纳米尺度的化学变化只能“显微”地看，让潜像浮现出来。
  transition_in: zoom-through
  visual: 镜头穿过光束扎进胶层：灰阶显微截面里，被照区域的分子网络慢慢变色，一块和掩模图形一模一样的“潜像”轮廓浮现，像照片在显影液里显出来。
