# Storyboard part 1: A0 开场 · A1 光刻是什么 · A2 为什么要短波长 · A3 三道难题 · B1 光源
# Source: projects/euv/script/script_zh.md (v4), skeleton.yaml, facts.yaml, plan §1/1b/1c/4/7/8.
# Durations: VO estimate = spoken chars / 250 per min + 0.35 s per line; shots add visual-only beats.
# Rules kept: every narration line verbatim exactly once, in order; ≤3 consecutive shots of one style;
# ≥3 styles per segment; every on-screen number cites fact ids; grade-C facts carry「据报道」.
# Accent colors: EUV-violet (EUV / λ), laser-orange (CO₂ drive laser), metrology-cyan (HUD, labels),
# line-white (blueprint). Font: 思源黑体 / Noto Sans SC. Nothing here imitates proprietary CAD:
# machine, nozzle and laser geometry are stylised and tagged 示意.
# ======================================================================== A0 开场（目标 50 s）
# ======================================================================== A1 光刻是什么（目标 80 s）
# ======================================================================== A2 为什么要短波长（目标 80 s）
# ======================================================================== A3 三道难题（目标 50 s）
# ======================================================================== B1 光源（目标 165 s）
shots:
- id: A0_01
  segment: A0
  duration: 4.0
  vo: []
  facts: []
  style: photoreal
  style_why: 冷开场先给一个不解释的“真东西”谜面：一颗锡滴；全片结尾（D 段）会回到它。
  transition_in: fade
  visual: 纯黑中，一颗银亮的锡滴从画左超慢动作掠入，表面映着冷蓝反光，焦外几颗 LED 散景；一道橙色细脉冲擦过，锡滴摊成薄盘；下一帧全屏紫白闪光、发光碎屑炸开——闪光最亮的一帧硬切黑。（全片的预告：结尾 D_09 在同一颗锡滴被击中前切黑，首尾呼应。）
  camera:
    move: locked-off
    lens_mm: 100
    fstop: 1.4
