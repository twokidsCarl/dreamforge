  facts: []
  style: photoreal
  style_why: 光刻胶是真实的材料，真实渲染让液体与高速旋转有质感。
  transition_in: match-cut
  visual: 同一机位，白模晶圆换上真实材质：黄光环境里，晶圆在旋涂机上高速旋转，琥珀色光刻胶从中心滴下，被甩成一层均匀的薄膜，边缘甩出细丝；镜面般的晶圆反射着黄色灯带。
  camera:
    move: low-angle slide
    lens_mm: 85
    fstop: 2.8
    notes: 贴着晶圆表面平移，液膜的前沿从焦外推进到焦内
